    else if (nodosOp.length > 1) opciones = nodosOp.map(n => `<option value="n:${esc(n.id)}">${esc(textoAlcance(current, {t:'n', v:n.id}))}</option>`).join('');
  }
  const mun = !!opciones;
  opciones = `<option value="">${fijo ? esc(nombreAlcance()) : 'Todo ' + esc(CATS[current].nombre)}</option>` + opciones;
  $('#sheet').innerHTML = `<div class="menu"><h3 id="dlgTitle">Compartir</h3><div class="sub">${esc(nombreAlcance())} · ${esc(fechaTxt(rep.fecha))}</div>
    ${mun ? `<label class="nl" for="mAlc" style="margin-top:10px">Qué incluir</label><select id="mAlc">${opciones}</select>
    <p class="hint2">Aplica al texto, la imagen, el Excel, el PDF y el link. ${CATS[current].municipios ? 'Elige todo el sistema o un municipio.' : 'Elige todo el sistema o un nodo.'}</p>` : ''}
    <button class="btn ghost" id="mTxt" type="button">📝 Reporte en texto (WhatsApp, correo)</button>
    <button class="btn ghost" id="mImg" type="button">🖼️ Reporte en imagen</button>
    <button class="btn ghost" id="mXls" type="button">📊 Reporte en Excel</button>
    <button class="btn ghost" id="mPdf" type="button">📄 Reporte en PDF (general + detalle por nodo)</button>
    <h4>Link de solo lectura</h4>
    <p class="hint2">Quien abra el link ve el resumen, el mapa y las listas, sin poder cambiar nada.</p>
    <label class="nl" for="mBase" style="margin-top:6px">Dirección de tu app</label>
    <input id="mBase" type="url" inputmode="url" placeholder="https://usuario.github.io/cctv-estado/" value="${esc(urlBase())}">
    <p class="hint2">Usa el link de tu app publicada en GitHub Pages. Se guarda en este teléfono.</p>
    <div class="sheetbtns"><button class="btn" id="mLink" type="button">Compartir link</button><button class="btn ghost" id="mCopy" type="button">Copiar</button></div>
    <div class="sheetbtns"><button class="btn ghost" id="cerrar" type="button">Cerrar</button></div></div>`;
  const d = $('#dlg'); if (!d.open) d.showModal();
  $('#cerrar').onclick = () => d.close();
  const elegido = () => { if (fijo) return null; const v = $('#mAlc') ? $('#mAlc').value : ''; return v ? {t: v.slice(0,1), v: v.slice(2)} : null; };
  $('#mTxt').onclick = () => { const a = elegido(); d.close(); conAlcance(a, (R2, r2) => compartir(R2, r2)); };
  $('#mImg').onclick = () => { const a = elegido(); conAlcance(a, (R2, r2) => imagenResumen(R2, r2)); };
  $('#mXls').onclick = () => { const a = elegido(); d.close(); conAlcance(a, (R2, r2) => descargarExcel(R2, r2, true)); };
  $('#mPdf').onclick = () => { const a = elegido(); d.close(); conAlcance(a, (R2, r2) => reportePDF(R2, r2, true)); };
  const generar = async () => {
    const base = $('#mBase').value.trim();
    if (!/^https?:\/\//i.test(base)){ toast('Escribe la dirección de tu app (empieza por https://)'); $('#mBase').focus(); return null; }
    store.set('cctv:baseurl', base);
    if (fijo) return await crearLink(rep, fijo);
    return await crearLink(rep, elegido());
  };
  $('#mLink').onclick = async () => { const url = await generar(); if (!url) return;
    const sel = $('#mAlc') && $('#mAlc').value; const txt = `Estado de cámaras CCTV ${CATS[current].nombre}${sel ? ' – ' + textoAlcance(current, {t: sel.slice(0,1), v: sel.slice(2)}) : (fijo ? ' – ' + textoAlcance(current, fijo) : '')} – reporte del ${fechaTxt(rep.fecha)}`;
    try { if (navigator.share){ await navigator.share({title: txt, text: txt, url}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast('Link copiado'); } catch(e){ prompt('Copia el link:', url); } };
  $('#mCopy').onclick = async () => { const url = await generar(); if (!url) return;
    try { await navigator.clipboard.writeText(url); toast('Link copiado, pégalo en WhatsApp o correo'); } catch(e){ prompt('Copia el link:', url); } };
}
async function compartir(R, rep){
  const nt = notas();
  const tot = R.enc + R.apa + R.nd;
  let t = `ESTADO CCTV ${nombreAlcance().toUpperCase()} – ${fechaTxt(rep.fecha)}\n`;
  t += `Cámaras: ${tot} | Encendidas ${R.enc} (${pct(R.enc,tot)}) | Apagadas ${R.apa} (${pct(R.apa,tot)})\n`;
  const nm = rep.rows.filter(r => r.Manual).length;
  if (nm) t += `(Incluye ${nm} cambio${nm>1?'s':''} de estado hecho${nm>1?'s':''} a mano)\n`;
  t += `Puntos: ${R.lista.length} | Sin novedad ${R.cuenta.SIN} | Con novedad ${R.cuenta.CON} | Fuera de servicio ${R.cuenta.FUE}\n`;
  const fue = R.lista.filter(p=>p.estado==='FUE'), con = R.lista.filter(p=>p.estado==='CON');
  if (fue.length){ t += `\nFUERA DE SERVICIO (${fue.length}):\n` + fue.map(p => `- ${p.nombre} (${p.cams.length} cám.)${nt[p.nombre]?' – '+nt[p.nombre]:''}`).join('\n') + '\n'; }
  if (con.length){ t += `\nCON NOVEDAD (${con.length}):\n` + con.map(p => `- ${p.nombre}: ${p.cams.filter(c=>c.estado==='APAGADA').map(c=>c.nombre).join(', ')}${nt[p.nombre]?' – '+nt[p.nombre]:''}`).join('\n') + '\n'; }
  if (getTopo()){ const SWc = estadoSwitches(getTopo(), rep); const D = diagnosticar(getTopo(), estadoParadas(R, getTopo()), SWc);
    const swOff = getTopo().nodos.filter(n => SWc[n.id] && SWc[n.id].Estado === 'APAGADA');
    if (SWc.__hay) t += `\nSWITCHES DE NODO: ${getTopo().nodos.filter(n => SWc[n.id]).length - swOff.length} responden, ${swOff.length} no responden${swOff.length ? ' (' + swOff.map(n => n.nombre).join(', ') + ')' : ''}\n`;
    if (D.hall.length) t += `\nTRAMOS A REVISAR (${D.hall.length}):\n` + D.hall.map(x => `- ${x.txt} ${x.revisar}`).join('\n') + '\n'; }
  const conImg = SHARED ? [] : await imagenesAlcance(R);
  if (conImg.length){ t += `\nIMÁGENES ADJUNTAS (${conImg.length}): ` + conImg.map(q => `${q.p.nombre} (${q.v.tipo === 'operativo' ? 'operativo' : 'novedad'})`).join(', ') + '\n';
    return compartirConImagenes(t, 'Estado CCTV ' + nombreAlcance(), conImg.map(q => entradaPunto(q.p))); }
  try { if (navigator.share){ await navigator.share({text:t}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(t); toast('Resumen copiado, pégalo en WhatsApp o correo'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Resumen copiado'); }catch(_){ toast('No se pudo copiar'); } ta.remove(); }
}

/* ---------- cargar archivo ---------- */
function guardarReporte(rows, nombreArchivo, causas){
  rows = rows.filter(r => (r.Nombre || '').trim() !== '');
  rows.forEach(r => { r.Nombre = r.Nombre.trim(); r.Estado = (r.Estado || '').trim().toUpperCase(); });
  const esSwitch = r => /^(SWITCH|GATEWAY|SERVIDOR|RADIO)\b/i.test(r.Nombre);
  const switches = rows.filter(esSwitch).map(r => ({Nombre:r.Nombre, IP:(r.IP||'').trim(), Estado:r.Estado, Responde_Ping:r.Responde_Ping||'', Puerto_Web_80:r.Puerto_Web_80||'', Revisado:r.Revisado||''}));
  rows = rows.filter(r => !esSwitch(r));
  if (!rows.length || !('Estado' in rows[0])){ toast('El archivo no tiene las columnas Nombre y Estado'); return; }
  const k = detectarSistema(rows);
  if (!k){ toast('No reconozco estas cámaras en ningún sistema'); return; }
  if (!rows.some(r => r.Estado === 'ENCENDIDA' || r.Estado === 'APAGADA')){ toast('El archivo no trae el estado de las cámaras'); return; }
  const fecha = String((rows.find(r => r.Revisado) || {}).Revisado || nombreArchivo);
  const antes = store.get('cctv:rep:' + k);
  const rep = {fecha, archivo:nombreArchivo, switches, rows: rows.map(r => ({Municipio:r.Municipio||'', Nombre:r.Nombre, IP:r.IP||'', Estado:r.Estado, Responde_Ping:r.Responde_Ping||'', Puerto_Web_80:r.Puerto_Web_80||'', Puerto_RTSP:r.Puerto_RTSP||'', Revisado:r.Revisado||''}))};
  if (antes && antes.fecha !== fecha) rep.prev = {fecha: antes.fecha, rows: antes.rows.map(r => ({Nombre:r.Nombre, Estado:r.Estado}))};
  else if (antes && antes.prev) rep.prev = antes.prev;
  const okRep = store.set('cctv:rep:' + k, rep);
  let msg = `Reporte de ${CATS[k].nombre} cargado`;
  if (causas){
    const validos = new Set(CATS[k].puntos);
    const n = store.get('cctv:notas:' + k) || {}; let c = 0;
    Object.entries(causas).forEach(([p,v]) => { if (validos.has(p)){ n[p] = v; c++; } });
    store.set('cctv:notas:' + k, n);
    msg += c ? ` con ${c} causa${c>1?'s':''}` : ' (sin causas escritas)';
  }
  toast(okRep ? msg : 'El reporte se ve, pero no se pudo guardar en el teléfono');
  current = k; store.set('cctv:sel', k); filtro = null; munFiltro = null; busqueda = '';
  render(); window.scrollTo(0,0);
}

function leerExcel(buf, nombreArchivo){
  if (typeof XLSX === 'undefined'){ toast('No se pudo cargar el lector de Excel. Revisa la conexión a internet.'); return; }
  let wb;
  try { wb = XLSX.read(buf, {type:'array'}); } catch(e){ toast('No se pudo abrir el Excel'); return; }
  const hoja = n => wb.Sheets[wb.SheetNames.find(x => x.trim().toLowerCase() === n)];
  const wsRep = hoja('reporte');
  if (!wsRep){ toast('El Excel no tiene la hoja Reporte'); return; }
  const rows = XLSX.utils.sheet_to_json(wsRep, {defval:'', raw:false}).map(r => {
    const o = {}; Object.keys(r).forEach(h => o[h.trim()] = String(r[h]).trim()); return o; });
  let causas = null;
  const wsP = hoja('puntos');
  if (wsP){
    causas = {};
    XLSX.utils.sheet_to_json(wsP, {defval:'', raw:false}).forEach(r => {
      const o = {}; Object.keys(r).forEach(h => o[h.trim().toLowerCase()] = String(r[h]).trim());
      const p = o['punto'], c = o['causa novedad'];
      if (p && c && c !== '0') (causas[p] = causas[p] || new Set()).add(c);
    });
  }
  // Causas escritas directamente en las tablas de la hoja Resumen
  const wsR = hoja('resumen');
  if (wsR){
    causas = causas || {};
    const aoa = XLSX.utils.sheet_to_json(wsR, {header:1, defval:'', raw:false});
    const deResumen = {};
    aoa.forEach((fila, ri) => {
      const norm = fila.map(x => String(x).trim().toLowerCase());
      norm.forEach((v, cc) => {
        if (v !== 'causa novedad') return;
        // columna "Punto" de esa misma tabla: la más cercana a la izquierda
        let pc = -1;
        for (let k = cc - 1; k >= 0; k--){ if (norm[k] === 'causa novedad') break; if (norm[k] === 'punto'){ pc = k; break; } }
        if (pc < 0) return;
        for (let r = ri + 1; r < aoa.length; r++){
          const p = String(aoa[r][pc] || '').trim(), c = String(aoa[r][cc] || '').trim();
          if (!p || !c || c === '0') continue;
          (deResumen[p] = deResumen[p] || new Set()).add(c);
        }
      });
    });
    Object.entries(deResumen).forEach(([p, set]) => { causas[p] = causas[p] || new Set(); set.forEach(c => causas[p].add(c)); });
  }
  if (causas) Object.keys(causas).forEach(p => { causas[p] = [...causas[p]].join(' / '); });
  guardarReporte(rows, nombreArchivo, causas);
}

$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = '';
  const rd = new FileReader();
  const esExcel = /\.xlsx?$/i.test(f.name);
  rd.onload = () => esExcel ? leerExcel(new Uint8Array(rd.result), f.name) : guardarReporte(parseCSV(String(rd.result)), f.name, null);
  rd.onerror = () => toast('No se pudo leer el archivo');
  esExcel ? rd.readAsArrayBuffer(f) : rd.readAsText(f, 'utf-8');
});
