<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#203868">
<title>Estado de cámaras CCTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F8; --surface:#FFFFFF; --ink:#1B2B48; --ink-2:#4A5D70; --line:#D3DCE4;
  --ok:#23845A; --ok-bg:#DDF1E6; --warn:#B7790F; --warn-bg:#FBEFD2; --bad:#C23B2E; --bad-bg:#F9DEDA;
  --nodata:#8C9AA8; --nodata-bg:#E3E8ED; --accent:#0860A8;
  --brand:#203868; --brand-2:#0860A8; --cyan:#00A8E8; --on-brand:#FFFFFF;
  --r-sm:6px; --r-md:12px;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A25; --surface:#172533; --ink:#E6EDF3; --ink-2:#9FB0C0; --line:#2A3B4C;
    --ok:#4CC38A; --ok-bg:#163A2B; --warn:#E6B047; --warn-bg:#3D3016; --bad:#F0705F; --bad-bg:#43211D;
    --nodata:#7D8C9A; --nodata-bg:#243444; --accent:#5CC4F0;
    --brand:#1C5DA8; --brand-2:#2E7BD0; --cyan:#00A8E8; --on-brand:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A25; --surface:#172533; --ink:#E6EDF3; --ink-2:#9FB0C0; --line:#2A3B4C;
  --ok:#4CC38A; --ok-bg:#163A2B; --warn:#E6B047; --warn-bg:#3D3016; --bad:#F0705F; --bad-bg:#43211D;
  --nodata:#7D8C9A; --nodata-bg:#243444; --accent:#5CC4F0;
    --brand:#1C5DA8; --brand-2:#2E7BD0; --cyan:#00A8E8; --on-brand:#FFFFFF;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
.brand{display:flex;align-items:center;gap:14px;padding:14px 0 12px;position:relative}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand-2) 55%,var(--cyan) 100%)}
.plate{background:#FFFFFF;border-radius:10px;padding:6px 10px;display:flex;align-items:center;box-shadow:0 1px 0 var(--line)}
.plate img{display:block;height:44px;width:auto}
.bt{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;color:var(--brand)}
.bs{font-size:13.5px;color:var(--ink-2);letter-spacing:.3px;text-transform:uppercase}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bt{color:var(--ink)}}
:root[data-theme="dark"] .bt{color:var(--ink)}

/* barra de sistemas */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.systems{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.systems::-webkit-scrollbar{display:none}
.sys{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;cursor:pointer;display:flex;gap:6px;align-items:center}
.sys[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sys .dot{width:8px;height:8px;border-radius:50%;background:var(--nodata)}
.sys .dot.on{background:var(--ok)}
.load{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.load label.btn{flex:1 1 100%}
.load .btn.ghost{flex:1 1 20%;padding:12px 4px}
.shbanner{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14.5px}
.menu > .btn{display:block;width:100%;margin:8px 0;text-align:left}
.menu .sheetbtns .btn{flex:1 1 0}
.cs:disabled::after{content:''}
.menu select,.menu input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);margin:4px 0 8px}
.menu h4{margin:18px 0 4px;font-family:var(--display);font-size:20px}
.menu .hint2{font-size:13px;color:var(--ink-2);margin:2px 0 8px}
.conex{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:12px;padding:10px 12px;margin:8px 0 4px;font-size:14.5px;line-height:1.4}.conex b{display:block;margin-bottom:2px}.nodoconex{margin:6px 0 2px;padding-left:18px;font-size:14px;color:var(--ink-2)}.nodoconex li{margin:2px 0}
.rutabtn{display:block;width:100%;margin:18px 0 0;padding:14px;border-radius:var(--r-md);border:2px dashed var(--brand-2);background:var(--surface);color:var(--brand);font-weight:700;font-size:16px;cursor:pointer;text-align:left}
.rquick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rlista{max-height:38vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface)}
.rit{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.rit:last-child{border-bottom:0}
.rit input{width:20px;height:20px;flex:0 0 auto;margin:0}.rit i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.rit span{font-weight:600;font-size:14.5px;line-height:1.25}.rit small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px}
.ropc select,.ropc input{width:100%}
.rbloque{border-top:3px solid var(--brand);margin-top:16px;padding-top:6px}.rbloque h5{font-family:var(--display);font-size:18px;margin:12px 0 2px;color:var(--brand-2)}
.rchk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}.rchk input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto}.rchk small{display:block;color:var(--ink-2);font-size:12.5px}
.olista{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0}
.oit{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}.oit:last-child{border-bottom:0}
.onum{min-width:24px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}.oit i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.onom{flex:1;font-weight:600;font-size:14px;line-height:1.25}.onom small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.obt{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer}.obt:disabled{opacity:.35}
.menu .opos{width:58px;flex:0 0 58px;height:34px;margin:0;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.rimg{display:flex;align-items:center;gap:10px;margin-top:6px}.rthumb{width:84px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.rimgtxt{flex:1;font-size:13px;color:var(--ink-2)}.rimg{flex-wrap:wrap}.imgtipo{display:flex;gap:14px;width:100%;font-size:14px}.imgtipo label{display:flex;gap:6px;align-items:center;cursor:pointer}
.imgacc{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.pegar{width:100%;min-height:44px;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--ink-2);background:var(--bg);outline:none}
.pegar:empty::before{content:attr(data-ph)}.pegar:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(0,168,232,.18)}
.rimgbts{display:flex;gap:6px}.rthumb{cursor:zoom-in}
.rimgadd{border:1px dashed var(--brand-2);background:var(--surface);color:var(--brand);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13.5px;cursor:pointer}
.rindice{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.rindice a{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13.5px;font-weight:600;color:var(--brand);text-decoration:none;background:var(--surface)}
.rol{padding-left:22px;margin:6px 0 10px}.rol li{margin:0 0 10px;line-height:1.35}.rol b{display:block}.rol .rtar{display:block;font-size:14px;color:var(--bad)}.rol .rnov{display:block;font-size:13.5px;font-style:italic;color:var(--ink)}.rol .rdir{display:block;font-size:13px;color:var(--ink-2)}.rol a{font-size:14px;font-weight:600}
.maplink{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 4px;text-decoration:none;color:var(--ink)}
.maplink .pin{font-size:22px}.maplink b{display:block;font-size:15px}.maplink span{font-size:13px;color:var(--ink-2)}
.mfil{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}.mfil::-webkit-scrollbar{display:none}
.mf{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
.mf b{font-variant-numeric:tabular-nums;margin-left:2px}
.mf[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.mf-lineas[aria-pressed="true"]{background:var(--brand-2);border-color:var(--brand-2)}
.mf-OTRO[aria-pressed="true"]{background:var(--nodata);border-color:var(--nodata)}
.mf-todo{border-style:dashed}
.mfan{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;margin-top:2px}.mfan span{font-size:13px;font-weight:600;color:var(--ink-2)}
.mf-an[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mf-SIN[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}.mf-CON[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}.mf-FUE[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.ico-mapa{background:none;border:0}.ico-mapa svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.lg-ico{display:inline-block;vertical-align:-3px;margin-right:4px}
.mapa{height:58vh;min-height:320px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:10px 0}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;background:#E3E8ED;outline:0;font-family:var(--body)}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-pane>svg path{pointer-events:none}.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto;cursor:pointer}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.4);border-radius:6px;overflow:hidden}.leaflet-bar a{background:#fff;border-bottom:1px solid #ccc;width:34px;height:34px;line-height:34px;display:block;text-align:center;text-decoration:none;color:#000;font:bold 20px Arial,sans-serif}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px;background:#fff;color:#1B2B48;box-shadow:0 3px 14px rgba(0,0,0,.35)}
.leaflet-popup-content{margin:12px 16px;line-height:1.35;font-size:14px}.leaflet-popup-content a{font-weight:600}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:#fff}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;width:26px;height:26px;font:18px/26px Arial,sans-serif;color:#757575;text-decoration:none;text-align:center}
.leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0;font-size:11px;padding:0 5px;color:#333}.leaflet-zoom-animated{transform-origin:0 0}
.maplnk{display:inline-block;margin:0 0 10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--ink)}
.imgprev{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block;margin:10px 0}
.btn{border:0;border-radius:var(--r-md);padding:12px 16px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--on-brand);flex:1;text-align:center}
.btn:active{background:var(--brand-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding:12px 12px}
input[type=file]{display:none}

/* encabezado del estado */
.hero{padding:22px 2px 6px}
.hero h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;color:var(--ink-2);letter-spacing:.2px}
.count{color:var(--brand);font-family:var(--display);font-weight:700;font-size:64px;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.count small{font-size:30px;color:var(--ink-2);font-weight:600}
.sub{color:var(--ink-2);font-size:15px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--nodata-bg);margin:14px 0 4px}
.bar span{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-bad{background:var(--bad)}
.barlegend{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.barlegend b{color:var(--ink);font-variant-numeric:tabular-nums}

/* estados de puntos */
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.st{border-radius:var(--r-md);padding:10px 10px 9px;border:2px solid transparent;cursor:pointer;text-align:left;background:var(--surface)}
.st .n{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.st .l{font-size:13px;line-height:1.2;color:var(--ink-2);margin-top:3px}
.st.ok .n{color:var(--ok)} .st.warn .n{color:var(--warn)} .st.bad .n{color:var(--bad)}
.st[aria-pressed="true"]{border-color:currentColor}
.st.ok[aria-pressed="true"]{border-color:var(--ok)} .st.warn[aria-pressed="true"]{border-color:var(--warn)} .st.bad[aria-pressed="true"]{border-color:var(--bad)}

section{margin-top:26px}
h2{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;margin:0 0 10px;padding-left:10px;border-left:4px solid var(--cyan)}
h2 .meta{display:block;font-family:var(--body);font-size:14px;font-weight:500;color:var(--ink-2);margin-top:3px}

/* muro de puntos */
.tools{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px}
.tile{position:relative;border:0;border-radius:var(--r-sm);padding:7px 4px 6px;cursor:pointer;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tile .c{font-family:var(--display);font-weight:700;font-size:19px;line-height:1}
.tile .m{font-size:10.5px;line-height:1.15;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .f{font-size:11px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad);color:#fff}
.t-nodata{background:var(--nodata-bg);color:var(--nodata)}
.tile.hide{display:none}
.tile .nd{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.t-bad .nd{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.mungroup{grid-column:1/-1;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink-2);margin:8px 0 1px}
.mungroup:first-child{margin-top:0}

/* tablas */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r-md);overflow:hidden;font-size:15px}
.tblwrap{overflow-x:auto;border-radius:var(--r-md)}
.tbl th,.tbl td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--on-brand);background:var(--brand);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700}
.tbl td.g{color:var(--ok);font-weight:600} .tbl td.r{color:var(--bad);font-weight:600}
.tbl tr.click{cursor:pointer}

/* listas de afectaciones */
.list{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.item{display:block;width:100%;border:0;background:none;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .name{font-weight:600}
.item .cnt{font-size:14px;color:var(--ink-2);white-space:nowrap}
.item .cams{font-size:14px;color:var(--bad);margin-top:3px}
.item .note{font-size:14px;color:var(--ink-2);margin-top:4px;font-style:italic}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.empty{background:var(--surface);border-radius:var(--r-md);padding:18px;color:var(--ink-2)}
.warnbox{background:var(--warn-bg);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;margin-top:14px;font-size:15px}

/* estado vacío */
.intro{padding:36px 4px 10px}
.intro h1{font-family:var(--display);font-size:34px;line-height:1.1;margin:0 0 10px}
.intro p{color:var(--ink-2);margin:0 0 10px;max-width:60ch}
.intro ol{color:var(--ink-2);padding-left:20px;margin:6px 0 0}

/* detalle del punto */
dialog{border:0;border-radius:16px 16px 0 0;padding:0;width:100%;max-width:760px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(10,20,30,.45)}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:88vh}
.sheet h3{font-family:var(--display);font-weight:600;font-size:26px;margin:0}
.sheet .sub{margin-bottom:12px}
.cam{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cam .cn{font-weight:600;font-size:15px}
.cam .ci{font-size:13px;color:var(--ink-2)}
.cam .cs{font-weight:700;font-size:13px;border-radius:6px;padding:3px 8px;white-space:nowrap}
.cs{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:6px 10px !important}
.cs::after{content:"⇄";font-weight:600;opacity:.7}
.cam .man{font-size:12.5px;color:var(--warn);font-weight:600;margin-top:2px}
.hint{font-size:13.5px;color:var(--ink-2);margin:-4px 0 6px}
.undo{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.cs.on{background:var(--ok-bg);color:var(--ok)} .cs.off{background:var(--bad-bg);color:var(--bad)} .cs.nd{background:var(--nodata-bg);color:var(--nodata)}
label.nl{display:block;font-weight:600;margin:16px 0 6px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;background:var(--bg)}
.sheetbtns{display:flex;gap:8px;margin-top:12px}
.redcard{background:var(--surface);border-radius:var(--r-md);padding:8px;margin-bottom:10px;overflow:hidden}
.redcard svg{width:100%;height:auto;display:block}
.redsvg{overflow-x:auto;-webkit-overflow-scrolling:touch}.redsvg svg{max-width:none;height:auto}
.redhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:15px}
.item.hall{cursor:default}
.swt td.dg{white-space:normal;text-align:left;min-width:220px}.swt td.w{color:var(--warn);font-weight:600}
.swt td:nth-child(1){white-space:normal;min-width:120px}
.item.hall.NODO,.item.hall.PRINCIPAL{border-left:5px solid var(--bad)}
.item.hall.ANILLO,.item.hall.TRAMO{border-left:5px solid var(--bad)}
.item.hall.RAMAL,.item.hall.PUNTO{border-left:5px solid var(--warn)}
.item.hall.DEPENDIENTE{border-left:5px solid var(--nodata)}
[data-nodo] circle,[data-stop] circle{transition:transform .15s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .count{color:var(--ink)}}
:root[data-theme="dark"] .count{color:var(--ink)}
@media (min-width:600px){.count{font-size:80px}.wall{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}}
</style>
</head>

  const conC = partes.filter(a => cen(a)); if (!conC.length) return {rutas: [], sin: partes.flatMap(a => a.sin)};
  const e = ejePrincipal(conC.map(a => ({c: cen(a)})));
  conC.sort((a,b) => (inv ? -1 : 1) * (e.p({c: cen(a)}) - e.p({c: cen(b)})));
  return {rutas: conC.flatMap(a => a.rutas), sin: partes.flatMap(a => a.sin)};
}
/* Reparte rutas consecutivas (ya encadenadas por cercanía) entre cuadrillas, con la carga de puntos más pareja posible */
function repartirCuadrillas(rutas, nc){
  const M = rutas.length; nc = Math.max(1, Math.min(nc, M)); if (!M) return [];
  const pre = [0]; rutas.forEach(r => pre.push(pre[pre.length-1] + r.length));
  const best = Array.from({length: nc+1}, () => new Array(M+1).fill(Infinity)), corte = Array.from({length: nc+1}, () => new Array(M+1).fill(0));
  best[0][0] = 0;
  for (let q = 1; q <= nc; q++) for (let i = q; i <= M; i++) for (let j = q-1; j < i; j++){ const v = Math.max(best[q-1][j], pre[i] - pre[j]); if (v < best[q][i]){ best[q][i] = v; corte[q][i] = j; } }
  const g = []; let fin = M; for (let q = nc; q >= 1; q--){ const j = corte[q][fin]; g.unshift(rutas.slice(j, fin).map((r, k) => ({r, n: j + k + 1}))); fin = j; }
  return g;
}

function descargarKML(titulo, marcas, lineas){
  const x = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const col = {SIN:'ff5a8423', CON:'ff0f79b7', FUE:'ff2e3bc2', ND:'ffa89a8c', SC:'ffa89a8c', NODO:'ff683820'};
  const est = {SIN:'Sin novedad', CON:'Con novedad', FUE:'Fuera de servicio', ND:'Sin datos', SC:'Sin cámaras', NODO:'Nodo'};
  let k = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${x('Cámaras ' + titulo + ' – ' + ahora())}</name>`;
  Object.entries(col).forEach(([e,c]) => k += `<Style id="${e}"><IconStyle><color>${c}</color><scale>1.1</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/wht-circle.png</href></Icon></IconStyle></Style>`);
  k += `<Style id="CASA"><IconStyle><scale>1.3</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/homegardenbusiness.png</href></Icon></IconStyle></Style><Style id="NODOI"><IconStyle><color>ffa86008</color><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_square.png</href></Icon></IconStyle></Style><Style id="TORRE"><IconStyle><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/triangle.png</href></Icon></IconStyle></Style>`;
  k += `<Style id="fibra"><LineStyle><color>ffa86008</color><width>3</width></LineStyle></Style><Style id="radio"><LineStyle><color>ff00a8e8</color><width>3</width></LineStyle></Style><Style id="caida"><LineStyle><color>ff2e3bc2</color><width>4</width></LineStyle></Style>`;
  marcas.forEach(m => k += `<Placemark><name>${x(m.p)}</name><styleUrl>#${m.ico === 'CASA' ? 'CASA' : m.ico === 'TORRE' ? 'TORRE' : m.ico === 'NODO' ? 'NODOI' : m.e}</styleUrl><description>${x((m.ico === 'CASA' ? 'Cuarto de monitoreo' : m.ico === 'TORRE' ? 'Torre de comunicaciones' : est[m.e]) + (m.cams !== undefined && m.e !== 'NODO' ? ` · ${m.enc}/${m.cams} encendidas` : '') + (m.dir ? ' · ' + m.dir : '') + (m.causa ? ' · Causa: ' + m.causa : ''))}</description><Point><coordinates>${m.c[1]},${m.c[0]},0</coordinates></Point></Placemark>`);
  lineas.forEach(l => k += `<Placemark><name>${l.radio ? 'Radioenlace' : 'Fibra'}</name><styleUrl>#${l.roja ? 'caida' : (l.radio ? 'radio' : 'fibra')}</styleUrl><LineString><coordinates>${l.c.map(c => c[1] + ',' + c[0] + ',0').join(' ')}</coordinates></LineString></Placemark>`);
  k += `</Document></kml>`;
  const blob = new Blob([k], {type:'application/vnd.google-earth.kml+xml'});
  const nombre = `Mapa camaras ${titulo.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\\/:*?"<>|]/g,'-')}.kml`;
  (async () => {
    try { const file = new File([blob], nombre, {type:'application/vnd.google-earth.kml+xml'}); if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:nombre}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
    if (dlPromise){ let dl = null; try { dl = await dlPromise; } catch(e){} if (dl){ try { await dl.save({filename:nombre, data:blob}); toast('KML descargado'); } catch(e){} return; } }
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); toast('KML descargado');
  })();
}

    pag.push({y, fn:b.fn}); y += b.h;

    p.forEach(b => g += b.fn(b.y));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PW} ${PH}" width="${PW}" height="${PH}">${g}</svg>`;

const ORDER = ['pereira','dosquebradas','quindio','virginia','santarosa'];
const ST = {SIN:'Sin novedad', CON:'Con novedad', FUE:'Fuera de servicio', ND:'Sin datos'};

/* ---------- almacenamiento local (solo en este teléfono) ---------- */
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let current = store.get('cctv:sel') || 'pereira';
let filtro = null;          // 'SIN' | 'CON' | 'FUE' | null
let busqueda = '';
let munFiltro = null;
let ultimoR = null;

/* ---------- lectura del CSV ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.split(';').length > first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep){ row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r'){
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else field += ch;
  }
  if (field !== '' || row.length){ row.push(field); if (row.some(x => x.trim() !== '')) rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => { const o = {}; head.forEach((h,i) => o[h] = (r[i] || '').trim()); return o; });
}

function detectarSistema(rows){
  let mejor = null, max = 0;
  for (const k of ORDER){
    const cat = CATS[k]; const nombres = new Set(cat.cams.map(c => c[0])); const alias = cat.alias || {};
    let n = 0; rows.forEach(r => { const nm = alias[r.Nombre] || r.Nombre; if (nombres.has(nm)) n++; });
    if (n > max){ max = n; mejor = k; }
  }
  return (mejor && max >= rows.length * 0.5) ? mejor : null;
}

/* ---------- cálculo del resumen ---------- */
function calcular(key, rep){
  const cat = CATS[key]; const alias = cat.alias || {};
  const info = {}; cat.cams.forEach(c => info[c[0]] = {punto:c[1], tipo:c[2], mun:c[3] || ''});
  const puntos = {}; cat.puntos.forEach(p => puntos[p] = {nombre:p, mun:'', cams:[], enc:0, apa:0, ptz:0, fija:0, lpr:0});
  cat.cams.forEach(c => { if (c[3]) puntos[c[1]].mun = c[3]; });
  const sinPunto = [];
  const tipos = {PTZ:{e:0,a:0,t:0}, FIJA:{e:0,a:0,t:0}, LPR:{e:0,a:0,t:0}};
  let enc = 0, apa = 0, nd = 0;
  rep.rows.forEach(r => {
    const nm = alias[r.Nombre] || r.Nombre; const inf = info[nm];
    const estado = (r.Estado || '').toUpperCase();
    const cam = {nombre:nm, orig:r.Nombre, manual:r.Manual||null, ip:r.IP, estado, ping:r.Responde_Ping, web:r.Puerto_Web_80, rtsp:r.Puerto_RTSP, tipo: inf ? inf.tipo : '?'};
    if (estado === 'ENCENDIDA') enc++; else if (estado === 'APAGADA') apa++; else nd++;
    if (inf && tipos[inf.tipo]){ tipos[inf.tipo].t++; if (estado === 'ENCENDIDA') tipos[inf.tipo].e++; else if (estado === 'APAGADA') tipos[inf.tipo].a++; }
    if (!inf || !puntos[inf.punto]){ sinPunto.push(cam); return; }
    const p = puntos[inf.punto]; p.cams.push(cam);
    if (estado === 'ENCENDIDA') p.enc++; else if (estado === 'APAGADA') p.apa++;
    if (inf.tipo === 'PTZ') p.ptz++; else if (inf.tipo === 'LPR') p.lpr++; else p.fija++;
  });
  let lista = cat.puntos.map(n => puntos[n]);
  const aK = (SHARED && SHARED.k === key && SHARED.alc) ? SHARED.alc : (key === current ? ALC_TMP : null);
  if (aK) lista = aK.t === 'm' ? lista.filter(p => p.mun === aK.v) : lista.filter(p => p.cams.length);
  lista.forEach(p => { p.estado = (p.enc + p.apa === 0) ? 'ND' : (p.enc === 0 ? 'FUE' : (p.apa === 0 ? 'SIN' : 'CON')); });
  const cuenta = {SIN:0, CON:0, FUE:0, ND:0}; lista.forEach(p => cuenta[p.estado]++);
  return {lista, cuenta, tipos, enc, apa, nd, total: rep.rows.length, sinPunto};
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? (a*100/b).toFixed(1).replace('.',',') + '%' : '0%';
function codigo(p){
  const m = p.match(/\b(P\d+|CAI \d+|LPR\d+)\b/);
  if (!m) return {c: p.slice(0,4), m: p};
  return {c: m[1].replace('CAI ','CAI'), m: p.slice(m.index + m[0].length).trim()};
}

function notas(){ return (SHARED && SHARED.k === current) ? SHARED.notas : (store.get('cctv:notas:' + current) || {}); }
let SHARED = null;   // reporte abierto desde un link (solo lectura)
function getRep(k){ return (SHARED && SHARED.k === k) ? SHARED.rep : store.get('cctv:rep:' + k); }
let ALC_TMP = null;   // alcance elegido en el menú Compartir (texto, imagen, Excel)
function alcActual(){ return (SHARED && SHARED.k === current && SHARED.alc) ? SHARED.alc : ALC_TMP; }
function repAlcance(rep, alc){
  if (!alc) return rep;
  const k = current, alias = CATS[k].alias || {}, cams = camsAlcance(k, alc);
  const nombres = new Set(cams.map(c => c[0]));
  const topo = TOPO[k], ips = new Set();
  if (topo){ const pts = new Set(cams.map(c => c[1])), par = new Set(cams.map(c => stopDeCamara(c[0], c[1], topo)));
    topo.nodos.filter(n => alc.t === 'n' ? n.id === alc.v : paradasNodo(n).some(p => pts.has(p) || par.has(p))).forEach(n => { if (n.ip) ips.add(n.ip); if (n.server) ips.add(n.server); }); }
  return Object.assign({}, rep, {rows: rep.rows.filter(r => nombres.has(alias[r.Nombre] || r.Nombre)), switches: (rep.switches || []).filter(x => ips.has(x.IP)), prev: null});
}
async function conAlcance(alc, fn){
  const base = getRep(current); if (!base) return;
  if (!alc || (SHARED && SHARED.alc)) return fn(ultimoR, base);
  ALC_TMP = alc;
  try { const r = repAlcance(base, alc); const R = calcular(current, r); await fn(R, r); }
  finally { ALC_TMP = null; }
}
function nombreNodo(k, id){ const t = TOPO[k]; const n = t && t.nodos.find(x => x.id === id); return n ? n.nombre : id; }
function textoAlcance(k, alc){ if (!alc) return ''; if (alc.t === 'm') return alc.v; const n = nombreNodo(k, alc.v); return /^NODO\b/i.test(n) ? n : 'Nodo ' + n; }
function camsAlcance(k, alc){
  const cat = CATS[k]; if (!alc) return cat.cams;
  if (alc.t === 'm') return cat.cams.filter(c => c[3] === alc.v);
  const t = TOPO[k], nd = t && t.nodos.find(n => n.id === alc.v); if (!nd) return [];
  const ps = new Set(paradasNodo(nd)); return cat.cams.filter(c => ps.has(stopDeCamara(c[0], c[1], t)));
}
function nombreAlcance(){ const a = alcActual(); return CATS[current].nombre + (a ? ' – ' + textoAlcance(current, a) : ''); }
function municipiosVista(){ const c = CATS[current]; if (!c.municipios) return null; const a = alcActual(); return (a && a.t === 'm') ? [a.v] : c.municipios; }
function getTopo(){
  const t = TOPO[current], a = alcActual(); if (!t || !a) return t;
  if (a.t === 'n') return Object.assign({}, t, {anilloPrincipal: [], nodos: t.nodos.filter(n => n.id === a.v)});
  const alc = new Set(CATS[current].cams.filter(c => c[3] === a.v).map(c => c[1]));
  return Object.assign({}, t, {nodos: t.nodos.filter(n => n.tipo === 'CORE' || paradasNodo(n).some(p => alc.has(p)))});
}
function fechaTxt(f){ if (!f) return ''; const m = f.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]} · ${m[4]}:${m[5]}` : f; }

/* ---------- render ---------- */
function renderSystems(){
  if (SHARED){
    $('#systems').innerHTML = `<div class="shbanner"><span>🔗 Reporte compartido · <b>${esc(nombreAlcance())}</b> · solo lectura</span><button class="sys" type="button" id="salirSh">Salir</button></div>`;
    $('#salirSh').onclick = () => { history.replaceState(null, '', location.pathname + location.search); SHARED = null; current = store.get('cctv:sel') || 'pereira'; render(); };
    document.querySelector('label[for=file]').style.display = 'none';
    return;
  }
  const lf = document.querySelector('label[for=file]'); if (lf) lf.style.display = '';
  $('#systems').innerHTML = ORDER.map(k => {
    const rep = store.get('cctv:rep:' + k);
    return `<button class="sys" type="button" data-k="${k}" aria-pressed="${k===current}"><span class="dot ${rep?'on':''}"></span>${esc(CATS[k].nombre)}</button>`;
  }).join('');
  document.querySelectorAll('.sys').forEach(b => b.onclick = () => { current = b.dataset.k; store.set('cctv:sel', current); filtro = null; munFiltro = null; busqueda = ''; render(); });
}

function render(){
  renderSystems();
  const rep = getRep(current);
  const main = $('#main');
  if (!rep){
    main.innerHTML = `<div class="intro"><h1>${esc(CATS[current].nombre)}: sin reporte cargado</h1>
      <p>Carga el archivo que genera el script en el servidor (reporte_camaras_*.csv) o el Excel de resumen con las causas ya escritas para ver el estado de las ${CATS[current].cams.length} cámaras y ${CATS[current].puntos.length} puntos.</p>
      <ol><li>Pasa el CSV al celular (correo, WhatsApp, Drive o cable).</li><li>Toca <b>Cargar archivo</b> y elige el reporte (.csv) o el Excel de resumen (.xlsx).</li><li>La app detecta sola si es Pereira, Dosquebradas, Quindío, La Virginia o Santa Rosa.</li></ol></div>`;
    return;
  }
  const R = calcular(current, rep); ultimoR = R;
  const nt = notas();
  const tot = R.enc + R.apa + R.nd;
  let h = `<div class="hero"><h1>${esc(nombreAlcance())} · reporte del ${esc(fechaTxt(rep.fecha))}</h1>
    <div class="count">${R.enc}<small> / ${tot} encendidas</small></div>
    <div class="bar" aria-hidden="true"><span class="b-ok" style="width:${tot?R.enc*100/tot:0}%"></span><span class="b-bad" style="width:${tot?R.apa*100/tot:0}%"></span></div>
    <div class="barlegend"><span>Encendidas <b>${pct(R.enc,tot)}</b></span><span>Apagadas <b>${R.apa}</b> (${pct(R.apa,tot)})</span></div></div>`;
  const manuales = rep.rows.filter(r => r.Manual);
  if (manuales.length) h += `<div class="warnbox">Este resumen incluye ${manuales.length} cambio${manuales.length>1?'s':''} de estado hecho${manuales.length>1?'s':''} a mano. Los ves en la sección Cambios hechos a mano.</div>`;
  if (R.nd) h += `<div class="warnbox">${R.nd} cámaras vienen sin estado (SIN IP u otro). Revisa el camaras.csv del servidor.</div>`;
  if (R.sinPunto.length) h += `<div class="warnbox">${R.sinPunto.length} cámaras del reporte no están en el catálogo de ${esc(CATS[current].nombre)}: ${R.sinPunto.slice(0,5).map(c=>esc(c.nombre)).join(', ')}${R.sinPunto.length>5?'…':''}. Se cuentan en el total pero no en ningún punto.</div>`;

  h += `<div class="states" role="group" aria-label="Filtrar puntos por estado">
    <button class="st ok" type="button" data-f="SIN" aria-pressed="${filtro==='SIN'}"><div class="n">${R.cuenta.SIN}</div><div class="l">Puntos sin novedad</div></button>
    <button class="st warn" type="button" data-f="CON" aria-pressed="${filtro==='CON'}"><div class="n">${R.cuenta.CON}</div><div class="l">Puntos con novedad</div></button>
    <button class="st bad" type="button" data-f="FUE" aria-pressed="${filtro==='FUE'}"><div class="n">${R.cuenta.FUE}</div><div class="l">Fuera de servicio</div></button></div>`;

  if (!SHARED) h += `<button class="rutabtn" type="button" id="rutaBtn">🧰 Rutas de mantenimiento${Object.keys(rutaSel()).length ? ` · <b>${Object.keys(rutaSel()).length}</b> puntos elegidos` : ''}</button>`;
  h += htmlRed(R, rep);
  // muro de puntos
  h += `<section><h2>Puntos <span class="meta">${R.lista.length} puntos · toca uno para ver sus cámaras</span></h2>
    <div class="tools"><input class="search" id="q" type="search" placeholder="Buscar punto o cámara" value="${esc(busqueda)}" aria-label="Buscar punto o cámara">
    ${(filtro||munFiltro)?'<button class="btn ghost" id="clr" type="button">Ver todos</button>':''}</div><div class="wall" id="wall">`;
  let lastMun = null;
  R.lista.forEach((p,i) => {
    if (p.mun && p.mun !== lastMun){ h += `<div class="mungroup" data-mun="${esc(p.mun)}">${esc(p.mun)}</div>`; lastMun = p.mun; }
    const cls = {SIN:'t-ok', CON:'t-warn', FUE:'t-bad', ND:'t-nodata'}[p.estado];
    const cd = codigo(p.nombre);
    const busc = (p.nombre + ' ' + p.cams.map(c=>c.nombre).join(' ')).toUpperCase();
    h += `<button class="tile ${cls}" type="button" data-i="${i}" data-e="${p.estado}" data-mun="${esc(p.mun)}" data-s="${esc(busc)}" aria-label="${esc(p.nombre)}: ${ST[p.estado]}${nt[p.nombre]?'. Causa: '+esc(nt[p.nombre]):''}">
      ${nt[p.nombre]?'<span class="nd" title="Tiene causa"></span>':''}<span class="c">${esc(cd.c)}</span><span class="m">${esc(cd.m)}</span>${p.estado==='CON'?`<span class="f">${p.apa}/${p.cams.length} off</span>`:''}</button>`;
  });
  h += `</div><div class="legend"><span><i style="background:var(--ok-bg);outline:1px solid var(--ok)"></i>Sin novedad</span><span><i style="background:var(--warn-bg);outline:1px solid var(--warn)"></i>Con novedad</span><span><i style="background:var(--bad)"></i>Fuera de servicio</span><span><i style="background:var(--nodata-bg)"></i>Sin datos</span><span><i style="background:var(--ink-2);border-radius:50%;width:8px;height:8px"></i>Tiene causa</span></div></section>`;

  // afectaciones
  const fue = R.lista.filter(p => p.estado === 'FUE'), con = R.lista.filter(p => p.estado === 'CON');
  h += `<section><h2>Fuera de servicio <span class="meta">${fue.length} puntos · ${fue.reduce((a,p)=>a+p.cams.length,0)} cámaras</span></h2>`;
  h += fue.length ? `<div class="list">${fue.map(p => itemPunto(p, R, nt, false)).join('')}</div>` : `<div class="empty">No hay puntos fuera de servicio.</div>`;
  h += `</section><section><h2>Con novedad <span class="meta">${con.length} puntos · ${con.reduce((a,p)=>a+p.apa,0)} cámaras apagadas</span></h2>`;
  h += con.length ? `<div class="list">${con.map(p => itemPunto(p, R, nt, true)).join('')}</div>` : `<div class="empty">No hay puntos con novedad.</div>`;
  h += `</section>`;

  // por municipio
  if (municipiosVista()){
    h += `<section><h2>Por municipio <span class="meta">toca un municipio para filtrar</span></h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Municipio</th><th>Cámaras</th><th>Enc.</th><th>Apag.</th><th>%</th><th>Fuera</th><th>Novedad</th></tr></thead><tbody>`;
    let T = {c:0,e:0,a:0,f:0,n:0};
    municipiosVista().forEach(m => {
      const ps = R.lista.filter(p => p.mun === m);
      const c = ps.reduce((a,p)=>a+p.cams.length,0), e = ps.reduce((a,p)=>a+p.enc,0), a = ps.reduce((x,p)=>x+p.apa,0);
      const f = ps.filter(p=>p.estado==='FUE').length, n = ps.filter(p=>p.estado==='CON').length;
      T.c+=c; T.e+=e; T.a+=a; T.f+=f; T.n+=n;
      h += `<tr class="click" data-mun="${esc(m)}"><td>${esc(m)}</td><td>${c}</td><td class="g">${e}</td><td class="${a?'r':''}">${a}</td><td>${pct(e,c)}</td><td class="${f?'r':''}">${f}</td><td>${n}</td></tr>`;
    });
    h += `</tbody><tfoot><tr><td>Total</td><td>${T.c}</td><td>${T.e}</td><td>${T.a}</td><td>${pct(T.e,T.c)}</td><td>${T.f}</td><td>${T.n}</td></tr></tfoot></table></div></section>`;
  }

  // por tipo
  h += `<section><h2>Por tipo de cámara</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Tipo</th><th>Encendidas</th><th>Apagadas</th><th>Total</th><th>%</th></tr></thead><tbody>`;
  [['PTZ','PTZ'],['FIJA','Fijas'],['LPR','LPR']].forEach(([k,l]) => { const t = R.tipos[k]; if (!t.t) return;
    h += `<tr><td>${l}</td><td class="g">${t.e}</td><td class="${t.a?'r':''}">${t.a}</td><td>${t.t}</td><td>${pct(t.e,t.t)}</td></tr>`; });
  h += `</tbody><tfoot><tr><td>Total</td><td>${R.enc}</td><td>${R.apa}</td><td>${tot}</td><td>${pct(R.enc,tot)}</td></tr></tfoot></table></div></section>`;

  // cambios manuales
  if (manuales.length){
    h += `<section><h2>Cambios hechos a mano <span class="meta">${manuales.length} cámara${manuales.length>1?'s':''} · no vienen del reporte del servidor</span></h2><div class="list">`;
    h += manuales.map(r => { const on = r.Estado === 'ENCENDIDA';
      return `<div class="item"><div class="top"><span class="name">${esc(r.Nombre)}</span><span class="pill ${on?'ok':'bad'}">${on?'Solucionada':'Marcada apagada'}</span></div>
        <div class="top" style="margin-top:6px"><span class="cnt">${esc(r.Manual.fecha)} · el reporte decía ${r.Manual.antes==='ENCENDIDA'?'encendida':'apagada'}</span><button class="undo" type="button" data-undo="${esc(r.Nombre)}">Deshacer</button></div></div>`; }).join('');
    h += `</div></section>`;
  }
  // cambios
  if (rep.prev){
    const antes = {}; rep.prev.rows.forEach(r => antes[r.Nombre] = (r.Estado||'').toUpperCase());
    const cambios = rep.rows.filter(r => antes[r.Nombre] && antes[r.Nombre] !== (r.Estado||'').toUpperCase());
    h += `<section><h2>Cambios <span class="meta">desde el reporte del ${esc(fechaTxt(rep.prev.fecha))}</span></h2>`;
    h += cambios.length ? `<div class="list">${cambios.map(r => { const on = (r.Estado||'').toUpperCase()==='ENCENDIDA';
      return `<div class="item"><div class="top"><span class="name">${esc(r.Nombre)}</span><span class="pill ${on?'ok':'bad'}">${on?'Se encendió':'Se apagó'}</span></div></div>`; }).join('')}</div>`
      : `<div class="empty">Ninguna cámara cambió de estado.</div>`;
    h += `</section>`;
  }
  h += `<p class="sub" style="margin-top:26px">Los reportes y las causas se guardan solo en este teléfono.</p>`;
  main.innerHTML = h;

  // eventos
  document.querySelectorAll('.st').forEach(b => b.onclick = () => { filtro = (filtro === b.dataset.f) ? null : b.dataset.f; render(); document.getElementById('wall').scrollIntoView({block:'start'}); });
  document.querySelectorAll('.tile,.item[data-i]').forEach(b => b.onclick = () => abrir(R.lista[+b.dataset.i]));
  document.querySelectorAll('tr.click').forEach(t => t.onclick = () => { munFiltro = (munFiltro === t.dataset.mun) ? null : t.dataset.mun; render(); document.getElementById('wall').scrollIntoView({block:'start'}); });
  const q = $('#q'); q.oninput = () => { busqueda = q.value; aplicarFiltro(); };
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => deshacerCambio(b.dataset.undo));
  const clr = $('#clr'); if (clr) clr.onclick = () => { filtro = null; munFiltro = null; render(); };
  aplicarFiltro();
  eventosRed(R);
  const rb = document.getElementById('rutaBtn'); if (rb) rb.onclick = () => abrirRuta(R, rep);
  $('#share').onclick = () => menuCompartir(R, rep);
  $('#xls').onclick = () => descargarExcel(R, rep);
  $('#img').onclick = () => imagenResumen(R, rep);
  $('#pdf').onclick = () => reportePDF(R, rep, false);
}

function itemPunto(p, R, nt, soloApagadas){
  const i = R.lista.indexOf(p);
  const tipos = [p.ptz?`${p.ptz} PTZ`:'', p.fija?`${p.fija} fija${p.fija>1?'s':''}`:'', p.lpr?`${p.lpr} LPR`:''].filter(Boolean).join(', ');
  const off = p.cams.filter(c => c.estado === 'APAGADA').map(c => c.nombre + (c.tipo==='PTZ'?' (PTZ)':''));
  return `<button class="item" type="button" data-i="${i}"><div class="top"><span class="name">${esc(p.nombre)}</span><span class="cnt">${soloApagadas?`${p.apa} de ${p.cams.length} apagadas`:tipos}</span></div>
    ${nodoDePunto(p.nombre)?`<div class="note" style="font-style:normal">Nodo ${esc(nodoDePunto(p.nombre))}</div>`:''}
    ${soloApagadas?`<div class="cams">${esc(off.join(' · '))}</div>`:''}
    ${nt[p.nombre]?`<div class="note">Causa: ${esc(nt[p.nombre])}</div>`:''}</button>`;
}

function aplicarFiltro(){
  const q = busqueda.trim().toUpperCase();
  document.querySelectorAll('.tile').forEach(t => {
    const ok = (!filtro || t.dataset.e === filtro) && (!munFiltro || t.dataset.mun === munFiltro) && (!q || t.dataset.s.includes(q));
    t.classList.toggle('hide', !ok);
  });
  document.querySelectorAll('.mungroup').forEach(g => {
    let n = g.nextElementSibling, vis = false;
    while (n && !n.classList.contains('mungroup')){ if (!n.classList.contains('hide')) { vis = true; break; } n = n.nextElementSibling; }
    g.style.display = vis ? '' : 'none';
  });
}

function abrir(p){
  const nt = notas();
  const cams = p.cams.map(c => {
    const cls = c.estado==='ENCENDIDA'?'on':(c.estado==='APAGADA'?'off':'nd');
    const txt = c.estado==='ENCENDIDA'?'Encendida':(c.estado==='APAGADA'?'Apagada':(c.estado||'Sin dato'));
    const man = c.manual ? `<div class="man">Cambiado a mano el ${esc(c.manual.fecha)} (el reporte decía ${c.manual.antes==='ENCENDIDA'?'encendida':'apagada'})</div>` : '';
    return `<div class="cam"><div><div class="cn">${esc(c.nombre)}</div><div class="ci">${SHARED ? esc(c.tipo) : `${esc(c.tipo)} · ${esc(c.ip||'sin IP')} · ping ${esc(c.ping||'-')} · web ${esc(c.web||'-')} · RTSP ${esc(c.rtsp||'-')}`}</div>${man}</div>
      <button class="cs ${cls}" type="button" data-orig="${esc(c.orig)}" aria-label="${esc(c.nombre)}: ${txt}. Toca para cambiar el estado">${txt}</button></div>`;
  }).join('');
  const tSW = getTopo(); const ipSw = tSW && tSW.swPunto && tSW.swPunto[p.nombre]; const rSw = ipSw && ULT_SW && ULT_SW.k === current && ULT_SW.m.__porIP[ipSw];
  const lineaSw = ipSw ? `<div class="sub" style="margin-top:-6px">Switch del punto ${esc(ipSw)}: <b style="color:${rSw ? (rSw.Estado==='ENCENDIDA'?'var(--ok)':'var(--bad)') : 'var(--ink-2)'}">${rSw ? (rSw.Estado==='ENCENDIDA'?'responde':'no responde') : 'sin dato en el reporte'}</b></div>` : '';
  const ub = ubicacion(p.nombre);
  const txtCon = textoConexiones(TOPO[current], p.nombre);
  const lineaCon = txtCon ? `<div class="conex"><b>🔗 Conexiones</b><span>${esc(txtCon)}</span></div>` : '';
  const lineaMapa = ub ? `<a class="maplink" href="${esc(ub.l)}" target="_blank" rel="noopener"><span class="pin">📍</span><div><b>Ver ubicación en Google Maps</b><span>${esc([ub.d, ub.s].filter(Boolean).join(' · ') || 'Abrir en el mapa')}</span></div></a>` : '';
  $('#sheet').innerHTML = `<h3 id="dlgTitle">${esc(p.nombre)}</h3><div class="sub">${p.mun?esc(p.mun)+' · ':''}${ST[p.estado]} · ${p.enc} encendidas, ${p.apa} apagadas</div>${lineaSw}${lineaMapa}${lineaCon}${SHARED ? '' : `<button class="maplnk" type="button" id="rutaPt">${enRuta(p.nombre) ? '✓ En las rutas de mantenimiento (quitar)' : '🧰 Agregar a las rutas de mantenimiento'}</button>`}<p class="hint">Si se solucionó una novedad, toca el estado de la cámara para cambiarlo.</p>${cams}
    <label class="nl" for="nota">Causa novedad</label><textarea id="nota" placeholder="Ej.: corte de energía, fibra cortada, cámara en mantenimiento">${esc(nt[p.nombre]||'')}</textarea>
    ${SHARED ? '' : `<div class="nl" style="margin-top:10px">Imagen (opcional)</div><p class="hint2" style="margin:0 0 4px">Adjunta la imagen de la novedad o, cuando se corrija, la del punto operativo. Se comparte en los reportes.</p><div class="rimg" id="imgPunto" data-img="${esc(p.nombre)}"></div>`}
    <div class="sheetbtns"><button class="btn" id="guardar" type="button">Guardar causa</button><button class="btn ghost" id="cerrar" type="button">Cerrar</button></div>`;
  const d = $('#dlg'); if (!d.open) d.showModal();
  $('#cerrar').onclick = () => d.close();
  if ($('#imgPunto')) pintarImgPunto($('#imgPunto'), p.nombre);
  if ($('#rutaPt')) $('#rutaPt').onclick = () => { const on = alternarRuta(p.nombre); $('#rutaPt').textContent = on ? '✓ En las rutas de mantenimiento (quitar)' : '🧰 Agregar a las rutas de mantenimiento'; toast(on ? 'Agregado a las rutas de mantenimiento' : 'Quitado de las rutas'); const rb = document.getElementById('rutaBtn'); if (rb){ const n = Object.keys(rutaSel()).length; rb.innerHTML = '🧰 Rutas de mantenimiento' + (n ? ` · <b>${n}</b> puntos elegidos` : ''); } };
  if (SHARED){
    const h = $('#sheet .hint'); if (h) h.remove();
    const ta = $('#nota'); ta.readOnly = true; if (!ta.value) ta.placeholder = 'Sin causa registrada';
    $('#guardar').remove(); document.querySelectorAll('#sheet .cs').forEach(b => { b.disabled = true; b.style.cursor = 'default'; });
    return;
  }
  document.querySelectorAll('#sheet .cs').forEach(b => b.onclick = () => {
    const borrador = $('#nota').value;
    cambiarEstado(b.dataset.orig);
    const np = ultimoR.lista.find(x => x.nombre === p.nombre);
    abrir(np); $('#nota').value = borrador;
  });
  $('#guardar').onclick = () => { const n = notas(); const v = $('#nota').value.trim(); if (v) n[p.nombre] = v; else delete n[p.nombre];
    store.set('cctv:notas:' + current, n) ? toast('Causa guardada') : toast('No se pudo guardar en este teléfono'); d.close(); render(); };
}
function ahora(){ const d = new Date(); const z = n => String(n).padStart(2,'0'); return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function cambiarEstado(orig, forzar){
  const rep = store.get('cctv:rep:' + current); if (!rep) return;
  const r = rep.rows.find(x => x.Nombre === orig); if (!r) return;
  const nuevo = forzar || (r.Estado === 'ENCENDIDA' ? 'APAGADA' : 'ENCENDIDA');
  if (r.Manual && r.Manual.antes === nuevo){ delete r.Manual; }
  else if (!r.Manual){ r.Manual = {antes: r.Estado, fecha: ahora()}; }
  else { r.Manual.fecha = ahora(); }
  r.Estado = nuevo;
  store.set('cctv:rep:' + current, rep) ? toast(`${orig}: ${nuevo === 'ENCENDIDA' ? 'encendida' : 'apagada'}`) : toast('No se pudo guardar el cambio');
  render();
}
function deshacerCambio(orig){
  const rep = store.get('cctv:rep:' + current); if (!rep) return;
  const r = rep.rows.find(x => x.Nombre === orig); if (!r || !r.Manual) return;
  r.Estado = r.Manual.antes; delete r.Manual;
  store.set('cctv:rep:' + current, rep); toast('Cambio deshecho'); render();
}

function construirLibro(R, rep){
  const nt = notas(); const cat = CATS[current]; const conMun = !!cat.municipios;
  const tot = R.enc + R.apa + R.nd;
  const P = (a,b) => b ? a/b : 0;
  const hojaDesde = (aoa, anchos, pctCeldas) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = anchos.map(w => ({wch:w}));
    (pctCeldas || []).forEach(ref => { if (ws[ref]) ws[ref].z = '0.0%'; });
    return ws;
  };
  const A = []; const pc = [];
  const add = fila => { A.push(fila); return A.length; };
  const cel = (col, fila) => XLSX.utils.encode_cell({c:col, r:fila-1});
  add([`RESUMEN DE ESTADO DE CÁMARAS – CCTV ${nombreAlcance().toUpperCase()}`]);
  add(['Fecha del reporte:', rep.fecha]);
  const nMan = rep.rows.filter(r => r.Manual).length;
  if (nMan) add(['Cambios de estado hechos a mano:', nMan, 'Ver columna "Cambio manual" en la hoja Reporte']);
  add([]);
  add(['Cámaras','Cantidad','%']);
  let f = add(['Total cámaras', tot, 1]); pc.push(cel(2,f));
  f = add(['Encendidas', R.enc, P(R.enc,tot)]); pc.push(cel(2,f));
  f = add(['Apagadas', R.apa, P(R.apa,tot)]); pc.push(cel(2,f));
  add([]);
  add(['Tipo de cámara','Encendidas','Apagadas','Total','% encendidas']);
  [['PTZ','PTZ'],['FIJA','Fijas'],['LPR','LPR']].forEach(([k,l]) => { const t = R.tipos[k]; f = add([l, t.e, t.a, t.t, P(t.e,t.t)]); pc.push(cel(4,f)); });
  f = add(['Total', R.enc, R.apa, tot, P(R.enc,tot)]); pc.push(cel(4,f));
  add([]);
  const np = R.lista.length;
  add(['Puntos','Cantidad','%']);
  f = add(['Total puntos', np, 1]); pc.push(cel(2,f));
  f = add(['Encendidos sin novedad (todas encendidas)', R.cuenta.SIN, P(R.cuenta.SIN,np)]); pc.push(cel(2,f));
  f = add(['Encendidos con novedad (alguna apagada)', R.cuenta.CON, P(R.cuenta.CON,np)]); pc.push(cel(2,f));
  f = add(['Fuera de servicio (todas apagadas)', R.cuenta.FUE, P(R.cuenta.FUE,np)]); pc.push(cel(2,f));
  if (conMun){
    add([]); add(['TOTAL POR MUNICIPIO']);
    add(['Municipio','Puntos','Cámaras','Encendidas','Apagadas','% encendidas','Sin novedad','Con novedad','Fuera de servicio']);
    const T = [0,0,0,0,0,0,0];
    municipiosVista().forEach(m => {
      const ps = R.lista.filter(p => p.mun === m);
      const v = [ps.length, ps.reduce((a,p)=>a+p.cams.length,0), ps.reduce((a,p)=>a+p.enc,0), ps.reduce((a,p)=>a+p.apa,0),
                 ps.filter(p=>p.estado==='SIN').length, ps.filter(p=>p.estado==='CON').length, ps.filter(p=>p.estado==='FUE').length];
      v.forEach((x,i) => T[i]+=x);
      f = add([m, v[0], v[1], v[2], v[3], P(v[2],v[1]), v[4], v[5], v[6]]); pc.push(cel(5,f));
    });
    f = add(['TOTAL GENERAL', T[0], T[1], T[2], T[3], P(T[2],T[1]), T[4], T[5], T[6]]); pc.push(cel(5,f));
  }
  add([]); add(['PUNTOS FUERA DE SERVICIO']);
  add(conMun ? ['N°','Punto','Municipio','PTZ','Fijas','LPR','Total cámaras','Causa novedad'] : ['N°','Punto','PTZ','Fijas','LPR','Total cámaras','Causa novedad']);
  const fue = R.lista.filter(p => p.estado === 'FUE');
  fue.forEach((p,i) => add(conMun ? [i+1, p.nombre, p.mun, p.ptz, p.fija, p.lpr, p.cams.length, nt[p.nombre]||''] : [i+1, p.nombre, p.ptz, p.fija, p.lpr, p.cams.length, nt[p.nombre]||'']));
  if (fue.length) add(conMun ? ['','Total','', fue.reduce((a,p)=>a+p.ptz,0), fue.reduce((a,p)=>a+p.fija,0), fue.reduce((a,p)=>a+p.lpr,0), fue.reduce((a,p)=>a+p.cams.length,0)]
                               : ['','Total', fue.reduce((a,p)=>a+p.ptz,0), fue.reduce((a,p)=>a+p.fija,0), fue.reduce((a,p)=>a+p.lpr,0), fue.reduce((a,p)=>a+p.cams.length,0)]);
  else add(['','Ninguno']);
  add([]); add(['PUNTOS ENCENDIDOS CON NOVEDAD – CÁMARAS APAGADAS']);
  add(conMun ? ['N°','Municipio','Punto','Cámara apagada','Tipo','Causa novedad'] : ['N°','Punto','Cámara apagada','Tipo','Causa novedad']);
  let n = 0;
  R.lista.filter(p => p.estado === 'CON').forEach(p => p.cams.filter(c => c.estado === 'APAGADA').forEach(c => {
    n++; add(conMun ? [n, p.mun, p.nombre, c.nombre, c.tipo, nt[p.nombre]||''] : [n, p.nombre, c.nombre, c.tipo, nt[p.nombre]||'']);
  }));
  if (!n) add(['','Ninguno']);
  const wsRes = hojaDesde(A, conMun ? [8,44,16,14,12,14,12,14,45] : [44,40,40,12,12,45], pc);

  // Hoja Puntos
  const B = [conMun ? ['Municipio','Punto','PTZ','Fijas','LPR','Total cámaras','Encendidas','Apagadas','Estado del punto','Causa novedad']
                    : ['Punto','PTZ','Fijas','LPR','Total cámaras','Encendidas','Apagadas','Estado del punto','Causa novedad']];
  const EST = {SIN:'ENCENDIDO SIN NOVEDAD', CON:'ENCENDIDO CON NOVEDAD', FUE:'FUERA DE SERVICIO', ND:'SIN DATOS'};
  const S = [0,0,0,0,0,0];
  R.lista.forEach(p => {
    const v = [p.ptz, p.fija, p.lpr, p.cams.length, p.enc, p.apa]; v.forEach((x,i) => S[i]+=x);
    B.push((conMun ? [p.mun, p.nombre] : [p.nombre]).concat(v, [EST[p.estado], nt[p.nombre]||'']));
  });
  B.push((conMun ? ['', 'TOTAL'] : ['TOTAL']).concat(S, [R.lista.length + ' puntos', '']));
  if (R.sinPunto.length) B.push((conMun ? ['', 'Cámaras sin punto asignado'] : ['Cámaras sin punto asignado']).concat(['','','', R.sinPunto.length]));
  const wsPts = hojaDesde(B, conMun ? [13,44,7,7,7,12,12,12,24,45] : [40,7,7,7,12,12,12,24,45]);

  // Hoja Reporte
  const info = {}; cat.cams.forEach(c => info[c[0]] = c);
  const alias = cat.alias || {};
  const C = [(conMun ? ['Municipio'] : []).concat(['Nombre','IP','Estado','Responde_Ping','Puerto_Web_80','Puerto_RTSP','Revisado','Punto','Tipo','Cambio manual'])];
  rep.rows.forEach(r => { const i = info[alias[r.Nombre] || r.Nombre];
    C.push((conMun ? [r.Municipio || (i ? i[3] : '')] : []).concat([r.Nombre, r.IP, r.Estado, r.Responde_Ping, r.Puerto_Web_80, r.Puerto_RTSP, r.Revisado, i ? i[1] : 'NO EN CATALOGO', i ? i[2] : '', r.Manual ? `Sí, ${r.Manual.fecha} (reporte: ${r.Manual.antes})` : ''])); });
  const wsRep = hojaDesde(C, (conMun ? [13] : []).concat([40,16,12,12,12,12,20,40,8,34]));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resumen');
  XLSX.utils.book_append_sheet(wb, wsPts, 'Puntos');
  XLSX.utils.book_append_sheet(wb, wsRep, 'Reporte');
  return wb;
}

/* ---------- Excel con colores (ExcelJS, se carga solo al descargar) ---------- */
function cargarScript(url){
  return new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = url; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
}
async function obtenerExcelJS(){
  if (window.ExcelJS) return window.ExcelJS;
  try { await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); } catch(e){ return null; }
  return window.ExcelJS || null;
}

async function construirLibroColor(ExcelJS, R, rep){
  const nt = notas(); const cat = CATS[current]; const conMun = !!cat.municipios;
  const tot = R.enc + R.apa + R.nd; const np = R.lista.length;
  const P = (a,b) => b ? a/b : 0;
  const C = {nav:'FF203868', azul2:'FF0860A8', cyan:'FF00A8E8', blanco:'FFFFFFFF', vf:'FFC6EFCE', vt:'FF006100', rf:'FFFFC7CE', rt:'FF9C0006', af:'FFFFEB9C', at:'FF9C5700',
             gf:'FFE7E6E6', gt:'FF595959', az:'FFD6EAF8', ent:'FFFFF2CC', linea:'FFBFBFBF'};
  const borde = {top:{style:'thin',color:{argb:C.linea}}, left:{style:'thin',color:{argb:C.linea}}, bottom:{style:'thin',color:{argb:C.linea}}, right:{style:'thin',color:{argb:C.linea}}};
  const fill = c => ({type:'pattern', pattern:'solid', fgColor:{argb:c}});
  const fuente = (o) => Object.assign({name:'Arial', size:10}, o || {});
  const EST = {SIN:'ENCENDIDO SIN NOVEDAD', CON:'ENCENDIDO CON NOVEDAD', FUE:'FUERA DE SERVICIO', ND:'SIN DATOS'};
  const colorEstado = v => ({'ENCENDIDO SIN NOVEDAD':[C.vf,C.vt], 'ENCENDIDA':[C.vf,C.vt], 'ENCENDIDO CON NOVEDAD':[C.af,C.at], 'FUERA DE SERVICIO':[C.rf,C.rt], 'APAGADA':[C.rf,C.rt], 'SIN DATOS':[C.gf,C.gt], 'NO EN CATALOGO':[C.gf,C.gt]})[v];

  const wb = new ExcelJS.Workbook(); wb.creator = 'Estado de cámaras CCTV';
  // helpers
  const encabezado = (ws, fila, col0) => { fila.eachCell({includeEmpty:false}, (c, n) => { if (n < col0) return;
      c.fill = fill(C.nav); c.font = fuente({bold:true, color:{argb:C.blanco}}); c.alignment = {horizontal:'center', vertical:'middle', wrapText:true}; c.border = borde; });
    fila.height = 30; };
  const celda = (c, o) => { c.border = borde; c.font = fuente(o && o.font); if (o && o.fill) c.fill = fill(o.fill); if (o && o.fmt) c.numFmt = o.fmt;
    c.alignment = (o && o.align) || {horizontal: typeof c.value === 'number' ? 'center' : 'left', vertical:'middle', wrapText: !!(o && o.wrap)}; };
  const titulo = (ws, txt, color) => { const r = ws.addRow([txt]); r.getCell(1).font = fuente({bold:true, size:12, color:{argb:color || C.nav}}); r.height = 20;
    r.getCell(1).border = {bottom:{style:'medium', color:{argb:C.cyan}}}; return r; };

  /* ---- Hoja Resumen ---- */
  const wr = wb.addWorksheet('Resumen', {views:[{showGridLines:false}]});
  const anchos = conMun ? [7,46,13,13,13,13,13,13,13,13,13] : [7,44,12,12,12,12,12,12,12,12];
  anchos.forEach((w,i) => wr.getColumn(i+1).width = w);
  // fila con celdas que pueden ocupar varias columnas: specs = [{v, span, izq}]
  const filaSpan = (specs, estilo) => {
    const vals = []; specs.forEach(sp => { vals.push(sp.v); for (let q = 1; q < (sp.span||1); q++) vals.push(null); });
    const row = wr.addRow(vals); let col = 1;
    specs.forEach(sp => {
      const n = sp.span || 1;
      for (let q = 0; q < n; q++){
        const c = row.getCell(col+q);
        if (estilo === 'cab'){ c.fill = fill(C.nav); c.font = fuente({bold:true, color:{argb:C.blanco}}); c.alignment = {horizontal:'center', vertical:'middle', wrapText:true}; c.border = borde; }
        else celda(c, {fill: estilo.fill, font: estilo.font, align: sp.izq ? {horizontal:'left', vertical:'middle', wrapText:true} : {horizontal:'center', vertical:'middle'}});
      }
      if (n > 1) wr.mergeCells(row.number, col, row.number, col+n-1);
      col += n;
    });
    if (estilo === 'cab') row.height = 30;
    return row;
  };
  // Encabezado con logo
  const logoId = wb.addImage({base64: LOGO_B64, extension: 'png'});
  for (let q = 0; q < 4; q++) wr.addRow([]);
  [1,2,3,4].forEach(q => wr.getRow(q).height = 16);
  wr.addImage(logoId, {tl:{col:0.15, row:0.15}, ext:{width:120, height:60}, editAs:'oneCell'});
  const tc = wr.getCell('C2'); tc.value = `INFORME DE ESTADO DE CÁMARAS – CCTV ${nombreAlcance().toUpperCase()}`; tc.font = fuente({bold:true, size:16, color:{argb:C.nav}});
  const fc = wr.getCell('C3'); fc.value = `Fecha del reporte: ${rep.fecha}`; fc.font = fuente({size:11, color:{argb:C.azul2}});
  const franja = wr.addRow([]); franja.height = 5;
  for (let q = 1; q <= anchos.length; q++) franja.getCell(q).fill = fill(q <= 2 ? C.nav : (q <= anchos.length - 3 ? C.azul2 : C.cyan));
  wr.addRow([]);
  let r;
  const nMan = rep.rows.filter(x => x.Manual).length;
  if (nMan){ r = wr.addRow(['', 'Cambios de estado hechos a mano:', nMan]); wr.addRow([]); r.getCell(2).font = fuente({bold:true, color:{argb:C.at}}); r.getCell(3).font = fuente({bold:true, color:{argb:C.at}}); }
  wr.addRow([]);
  // bloque de tablas pequeñas (columnas B a F)
  const tablaKPI = (cab, filas) => {
    encabezado(wr, wr.addRow([''].concat(cab)), 2);
    filas.forEach(f => { const row = wr.addRow([''].concat(f.v));
      row.eachCell({includeEmpty:false}, (c, n) => { if (n < 2) return;
        const o = {font: f.bold ? {bold:true} : {}}; if (f.pct && f.pct.includes(n)) o.fmt = '0.0%';

async function descargarExcel(R, rep, compartirArchivo){
  const f = (rep.fecha.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/) || []);
  const sello = f.length ? `${f[1]}-${f[2]}-${f[3]}_${f[4].padStart(2,'0')}-${f[5]}` : new Date().toISOString().slice(0,10);
  const nombre = `RESUMEN CAMARAS ${nombreAlcance().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')} ${sello}.xlsx`;
  toast('Preparando el Excel…');
  let blob = null;
  const ExcelJS = await obtenerExcelJS();
  if (ExcelJS){
    try { const wb = await construirLibroColor(ExcelJS, R, rep); const buf = await wb.xlsx.writeBuffer(); blob = new Blob([buf]); }
    catch(e){ blob = null; }
  }
  if (!blob){
    if (typeof XLSX === 'undefined'){ toast('No se pudo generar el Excel. Revisa la conexión a internet.'); return; }
    blob = new Blob([XLSX.write(construirLibro(R, rep), {bookType:'xlsx', type:'array'})]);
    toast('Se generó el Excel sin colores');
  }
  if (compartirArchivo){
    try { const file = new File([blob], nombre, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title: nombre}); return; } }
    catch(e){ if (e && e.name === 'AbortError') return; }
    toast('Este navegador no permite compartir el archivo directamente: se descargará');
  }
  if (dlPromise){
    let dl = null; try { dl = await dlPromise; } catch(e){ dl = null; }
    if (!dl){ toast('La descarga no está disponible en esta vista'); return; }
    try { await dl.save({filename: nombre, data: blob}); toast('Excel descargado'); }
    catch(e){ const code = e && e.code;
      if (code === 'declined') return;
      toast(code === 'rate_limited' ? 'Ya hay una descarga pendiente, espera un momento' : 'No se pudo descargar el Excel aquí'); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([blob], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Excel descargado');
  } catch(e){ toast('No se pudo descargar el Excel'); }
}

function urlBase(){
  const guardada = store.get('cctv:baseurl'); if (guardada) return guardada;
  const enClaude = location.protocol === 'file:' || /claude|anthropic|usercontent/i.test(location.hostname) || (window.claude && typeof window.claude.use === 'function');
  return enClaude ? '' : location.origin + location.pathname;
}
function b64u(bytes){ let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function deB64u(t){ t = t.replace(/-/g,'+').replace(/_/g,'/'); while (t.length % 4) t += '='; const s = atob(t); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function comprimir(txt){
  const bytes = new TextEncoder().encode(txt);
  if (typeof CompressionStream === 'undefined') return 'j' + b64u(bytes);
  try { const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'z' + b64u(new Uint8Array(await new Response(cs).arrayBuffer())); }
  catch(e){ return 'j' + b64u(bytes); }
}
async function descomprimir(t){
  const bytes = deB64u(t.slice(1));
  if (t[0] === 'j') return new TextDecoder().decode(bytes);
  const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new TextDecoder().decode(await new Response(ds).arrayBuffer());
}
async function crearLink(rep, alc){
  const k = current, cat = CATS[k], alias = cat.alias || {};
  const est = {}; rep.rows.forEach(r => est[alias[r.Nombre] || r.Nombre] = r.Estado);
  const cams = camsAlcance(k, alc);
  const s = cams.map(c => est[c[0]] === 'ENCENDIDA' ? '1' : (est[c[0]] === 'APAGADA' ? '0' : '-')).join('');
  const puntosAlc = new Set(cams.map(c => c[1])); const nt = (SHARED && SHARED.k === k) ? SHARED.notas : (store.get('cctv:notas:' + k) || {});
  const c = {}; Object.entries(nt).forEach(([p,v]) => { if (puntosAlc.has(p)) c[p] = v; });
  const topo = TOPO[k]; const ips = new Set();
  const paradasAlc = new Set(topo ? cams.map(c => stopDeCamara(c[0], c[1], topo)) : []);
  if (topo) topo.nodos.filter(n => !alc || (alc.t === 'n' ? n.id === alc.v : paradasNodo(n).some(p => puntosAlc.has(p) || paradasAlc.has(p)))).forEach(n => { if (n.ip) ips.add(n.ip); if (n.server) ips.add(n.server); });
  const w = (rep.switches || []).filter(x => ips.has(x.IP) || (!alc && /^GATEWAY/i.test(x.Nombre))).map(x => [x.IP, x.Estado === 'ENCENDIDA' ? 1 : 0, /^SERVIDOR/i.test(x.Nombre) ? 'V' : (/^GATEWAY/i.test(x.Nombre) ? 'G' : 'S')]);
  const payload = {v:2, k, a: alc ? [alc.t, alc.v] : null, m: alc && alc.t === 'm' ? alc.v : null, f: rep.fecha, s, c, w, x: rep.rows.filter(r => r.Manual).length};
  return urlBase().replace(/#.*$/, '') + '#r=' + await comprimir(JSON.stringify(payload));
}
async function abrirLinkCompartido(){
  const h = location.hash; if (!h.startsWith('#r=')) return false;
  try {
    const p = JSON.parse(await descomprimir(h.slice(3)));
    if (!CATS[p.k]) throw new Error('sistema');
    const alc = p.a ? {t: p.a[0], v: p.a[1]} : (p.m ? {t:'m', v:p.m} : null);
    const cams = camsAlcance(p.k, alc);
    const rows = []; cams.forEach((c,i) => { const ch = p.s[i]; if (ch === '1' || ch === '0') rows.push({Municipio:c[3]||'', Nombre:c[0], IP:'', Estado: ch === '1' ? 'ENCENDIDA' : 'APAGADA', Responde_Ping:'', Puerto_Web_80:'', Puerto_RTSP:'', Revisado:p.f}); });
    const switches = (p.w || []).map(([ip, e, t]) => ({Nombre: t === 'V' ? 'SERVIDOR' : (t === 'G' ? 'GATEWAY' : 'SWITCH'), IP: ip, Estado: e ? 'ENCENDIDA' : 'APAGADA', Responde_Ping: e ? 'Si' : 'No', Puerto_Web_80:'', Revisado:p.f}));
    const rep = {fecha: p.f, rows, switches};
    if (p.x) rep.rows.slice(0, 0);
    SHARED = {k: p.k, alc, rep, notas: p.c || {}, manuales: p.x || 0};
    current = p.k;
    return true;
  } catch(e){ toast('El link del reporte no es válido o está incompleto'); return false; }
}
function menuCompartir(R, rep){

  const t0 = TOPO[current]; const nodosOp = t0 ? t0.nodos.filter(n => paradasNodo(n).length) : [];
