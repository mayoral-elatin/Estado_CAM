<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324F">
<title>Estado de cámaras CCTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF2; --surface:#FFFFFF; --ink:#16324F; --ink-2:#4A5D70; --line:#D3DCE4;
  --ok:#23845A; --ok-bg:#DDF1E6; --warn:#B7790F; --warn-bg:#FBEFD2; --bad:#C23B2E; --bad-bg:#F9DEDA;
  --nodata:#8C9AA8; --nodata-bg:#E3E8ED; --accent:#16324F;
  --r-sm:6px; --r-md:12px;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A25; --surface:#172533; --ink:#E6EDF3; --ink-2:#9FB0C0; --line:#2A3B4C;
    --ok:#4CC38A; --ok-bg:#163A2B; --warn:#E6B047; --warn-bg:#3D3016; --bad:#F0705F; --bad-bg:#43211D;
    --nodata:#7D8C9A; --nodata-bg:#243444; --accent:#8FB8E0;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A25; --surface:#172533; --ink:#E6EDF3; --ink-2:#9FB0C0; --line:#2A3B4C;
  --ok:#4CC38A; --ok-bg:#163A2B; --warn:#E6B047; --warn-bg:#3D3016; --bad:#F0705F; --bad-bg:#43211D;
  --nodata:#7D8C9A; --nodata-bg:#243444; --accent:#8FB8E0;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}

/* barra de sistemas */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.systems{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.systems::-webkit-scrollbar{display:none}
.sys{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;cursor:pointer;display:flex;gap:6px;align-items:center}
.sys[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sys .dot{width:8px;height:8px;border-radius:50%;background:var(--nodata)}
.sys .dot.on{background:var(--ok)}
.load{margin-top:10px;display:flex;gap:8px}
.btn{border:0;border-radius:var(--r-md);padding:12px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);flex:1;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);flex:0 0 auto}
input[type=file]{display:none}

/* encabezado del estado */
.hero{padding:22px 2px 6px}
.hero h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;color:var(--ink-2);letter-spacing:.2px}
.count{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.count small{font-size:30px;color:var(--ink-2);font-weight:600}
.sub{color:var(--ink-2);font-size:15px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--nodata-bg);margin:14px 0 4px}
.bar span{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-bad{background:var(--bad)}
.barlegend{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.barlegend b{color:var(--ink);font-variant-numeric:tabular-nums}

/* estados de puntos */
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.st{border-radius:var(--r-md);padding:10px 10px 9px;border:2px solid transparent;cursor:pointer;text-align:left;background:var(--surface)}
.st .n{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.st .l{font-size:13px;line-height:1.2;color:var(--ink-2);margin-top:3px}
.st.ok .n{color:var(--ok)} .st.warn .n{color:var(--warn)} .st.bad .n{color:var(--bad)}
.st[aria-pressed="true"]{border-color:currentColor}
.st.ok[aria-pressed="true"]{border-color:var(--ok)} .st.warn[aria-pressed="true"]{border-color:var(--warn)} .st.bad[aria-pressed="true"]{border-color:var(--bad)}

section{margin-top:26px}
h2{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;margin:0 0 10px}
h2 .meta{display:block;font-family:var(--body);font-size:14px;font-weight:500;color:var(--ink-2);margin-top:3px}

/* muro de puntos */
.tools{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px}
.tile{position:relative;border:0;border-radius:var(--r-sm);padding:7px 4px 6px;cursor:pointer;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tile .c{font-family:var(--display);font-weight:700;font-size:19px;line-height:1}
.tile .m{font-size:10.5px;line-height:1.15;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .f{font-size:11px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad);color:#fff}
.t-nodata{background:var(--nodata-bg);color:var(--nodata)}
.tile.hide{display:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.mungroup{grid-column:1/-1;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink-2);margin:8px 0 1px}
.mungroup:first-child{margin-top:0}

/* tablas */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r-md);overflow:hidden;font-size:15px}
.tblwrap{overflow-x:auto;border-radius:var(--r-md)}
.tbl th,.tbl td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--ink-2);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700}
.tbl td.g{color:var(--ok);font-weight:600} .tbl td.r{color:var(--bad);font-weight:600}
.tbl tr.click{cursor:pointer}

/* listas de afectaciones */
.list{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.item{display:block;width:100%;border:0;background:none;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .name{font-weight:600}
.item .cnt{font-size:14px;color:var(--ink-2);white-space:nowrap}
.item .cams{font-size:14px;color:var(--bad);margin-top:3px}
.item .note{font-size:14px;color:var(--ink-2);margin-top:4px;font-style:italic}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.empty{background:var(--surface);border-radius:var(--r-md);padding:18px;color:var(--ink-2)}
.warnbox{background:var(--warn-bg);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;margin-top:14px;font-size:15px}

/* estado vacío */
.intro{padding:36px 4px 10px}
.intro h1{font-family:var(--display);font-size:34px;line-height:1.1;margin:0 0 10px}
.intro p{color:var(--ink-2);margin:0 0 10px;max-width:60ch}
.intro ol{color:var(--ink-2);padding-left:20px;margin:6px 0 0}

/* detalle del punto */
dialog{border:0;border-radius:16px 16px 0 0;padding:0;width:100%;max-width:760px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(10,20,30,.45)}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:88vh}
.sheet h3{font-family:var(--display);font-weight:600;font-size:26px;margin:0}
.sheet .sub{margin-bottom:12px}
.cam{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cam .cn{font-weight:600;font-size:15px}
.cam .ci{font-size:13px;color:var(--ink-2)}
.cam .cs{font-weight:700;font-size:13px;border-radius:6px;padding:3px 8px;white-space:nowrap}
.cs.on{background:var(--ok-bg);color:var(--ok)} .cs.off{background:var(--bad-bg);color:var(--bad)} .cs.nd{background:var(--nodata-bg);color:var(--nodata)}
label.nl{display:block;font-weight:600;margin:16px 0 6px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;background:var(--bg)}
.sheetbtns{display:flex;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (min-width:600px){.count{font-size:80px}.wall{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}}
</style>
</head>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- lectura del CSV ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.split(';').length > first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep){ row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r'){
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else field += ch;
  }
  if (field !== '' || row.length){ row.push(field); if (row.some(x => x.trim() !== '')) rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => { const o = {}; head.forEach((h,i) => o[h] = (r[i] || '').trim()); return o; });
}

function detectarSistema(rows){
  let mejor = null, max = 0;
  for (const k of ORDER){
    const cat = CATS[k]; const nombres = new Set(cat.cams.map(c => c[0])); const alias = cat.alias || {};
    let n = 0; rows.forEach(r => { const nm = alias[r.Nombre] || r.Nombre; if (nombres.has(nm)) n++; });
    if (n > max){ max = n; mejor = k; }
  }
  return (mejor && max >= rows.length * 0.5) ? mejor : null;
}

/* ---------- cálculo del resumen ---------- */
function calcular(key, rep){
  const cat = CATS[key]; const alias = cat.alias || {};
  const info = {}; cat.cams.forEach(c => info[c[0]] = {punto:c[1], tipo:c[2], mun:c[3] || ''});
  const puntos = {}; cat.puntos.forEach(p => puntos[p] = {nombre:p, mun:'', cams:[], enc:0, apa:0, ptz:0, fija:0, lpr:0});
  cat.cams.forEach(c => { if (c[3]) puntos[c[1]].mun = c[3]; });
  const sinPunto = [];
  const tipos = {PTZ:{e:0,a:0,t:0}, FIJA:{e:0,a:0,t:0}, LPR:{e:0,a:0,t:0}};
  let enc = 0, apa = 0, nd = 0;
  rep.rows.forEach(r => {
    const nm = alias[r.Nombre] || r.Nombre; const inf = info[nm];
    const estado = (r.Estado || '').toUpperCase();
    const cam = {nombre:nm, ip:r.IP, estado, ping:r.Responde_Ping, web:r.Puerto_Web_80, rtsp:r.Puerto_RTSP, tipo: inf ? inf.tipo : '?'};
    if (estado === 'ENCENDIDA') enc++; else if (estado === 'APAGADA') apa++; else nd++;
    if (inf && tipos[inf.tipo]){ tipos[inf.tipo].t++; if (estado === 'ENCENDIDA') tipos[inf.tipo].e++; else if (estado === 'APAGADA') tipos[inf.tipo].a++; }
    if (!inf || !puntos[inf.punto]){ sinPunto.push(cam); return; }
    const p = puntos[inf.punto]; p.cams.push(cam);
    if (estado === 'ENCENDIDA') p.enc++; else if (estado === 'APAGADA') p.apa++;
    if (inf.tipo === 'PTZ') p.ptz++; else if (inf.tipo === 'LPR') p.lpr++; else p.fija++;
  });
  const lista = cat.puntos.map(n => puntos[n]);
  lista.forEach(p => { p.estado = (p.enc + p.apa === 0) ? 'ND' : (p.enc === 0 ? 'FUE' : (p.apa === 0 ? 'SIN' : 'CON')); });
  const cuenta = {SIN:0, CON:0, FUE:0, ND:0}; lista.forEach(p => cuenta[p.estado]++);
  return {lista, cuenta, tipos, enc, apa, nd, total: rep.rows.length, sinPunto};
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? (a*100/b).toFixed(1).replace('.',',') + '%' : '0%';
function codigo(p){
  const m = p.match(/\b(P\d+|CAI \d+|LPR\d+)\b/);
  if (!m) return {c: p.slice(0,4), m: p};
  return {c: m[1].replace('CAI ','CAI'), m: p.slice(m.index + m[0].length).trim()};
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200); }
function notas(){ return store.get('cctv:notas:' + current) || {}; }
function fechaTxt(f){ if (!f) return ''; const m = f.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]} · ${m[4]}:${m[5]}` : f; }

/* ---------- render ---------- */
function renderSystems(){

    const rep = store.get('cctv:rep:' + k);
    return `<button class="sys" type="button" data-k="${k}" aria-pressed="${k===current}"><span class="dot ${rep?'on':''}"></span>${esc(CATS[k].nombre)}</button>`;
  }).join('');
  document.querySelectorAll('.sys').forEach(b => b.onclick = () => { current = b.dataset.k; store.set('cctv:sel', current); filtro = null; munFiltro = null; busqueda = ''; render(); });
}

    <div class="barlegend"><span>Encendidas <b>${pct(R.enc,tot)}</b></span><span>Apagadas <b>${R.apa}</b> (${pct(R.apa,tot)})</span></div></div>`;
  if (R.nd) h += `<div class="warnbox">${R.nd} cámaras vienen sin estado (SIN IP u otro). Revisa el camaras.csv del servidor.</div>`;
  if (R.sinPunto.length) h += `<div class="warnbox">${R.sinPunto.length} cámaras del reporte no están en el catálogo de ${esc(CATS[current].nombre)}: ${R.sinPunto.slice(0,5).map(c=>esc(c.nombre)).join(', ')}${R.sinPunto.length>5?'…':''}. Se cuentan en el total pero no en ningún punto.</div>`;

  h += `<div class="states" role="group" aria-label="Filtrar puntos por estado">
    <button class="st ok" type="button" data-f="SIN" aria-pressed="${filtro==='SIN'}"><div class="n">${R.cuenta.SIN}</div><div class="l">Puntos sin novedad</div></button>
    <button class="st warn" type="button" data-f="CON" aria-pressed="${filtro==='CON'}"><div class="n">${R.cuenta.CON}</div><div class="l">Puntos con novedad</div></button>
    <button class="st bad" type="button" data-f="FUE" aria-pressed="${filtro==='FUE'}"><div class="n">${R.cuenta.FUE}</div><div class="l">Fuera de servicio</div></button></div>`;

  // muro de puntos
  h += `<section><h2>Puntos <span class="meta">${R.lista.length} puntos · toca uno para ver sus cámaras</span></h2>
    <div class="tools"><input class="search" id="q" type="search" placeholder="Buscar punto o cámara" value="${esc(busqueda)}" aria-label="Buscar punto o cámara">
    ${(filtro||munFiltro)?'<button class="btn ghost" id="clr" type="button">Ver todos</button>':''}</div><div class="wall" id="wall">`;
  let lastMun = null;
  R.lista.forEach((p,i) => {
    if (p.mun && p.mun !== lastMun){ h += `<div class="mungroup" data-mun="${esc(p.mun)}">${esc(p.mun)}</div>`; lastMun = p.mun; }
    const cls = {SIN:'t-ok', CON:'t-warn', FUE:'t-bad', ND:'t-nodata'}[p.estado];
    const cd = codigo(p.nombre);
    const busc = (p.nombre + ' ' + p.cams.map(c=>c.nombre).join(' ')).toUpperCase();
    h += `<button class="tile ${cls}" type="button" data-i="${i}" data-e="${p.estado}" data-mun="${esc(p.mun)}" data-s="${esc(busc)}" aria-label="${esc(p.nombre)}: ${ST[p.estado]}">
      <span class="c">${esc(cd.c)}</span><span class="m">${esc(cd.m)}</span>${p.estado==='CON'?`<span class="f">${p.apa}/${p.cams.length} off</span>`:''}</button>`;
  });
  h += `</div><div class="legend"><span><i style="background:var(--ok-bg);outline:1px solid var(--ok)"></i>Sin novedad</span><span><i style="background:var(--warn-bg);outline:1px solid var(--warn)"></i>Con novedad</span><span><i style="background:var(--bad)"></i>Fuera de servicio</span><span><i style="background:var(--nodata-bg)"></i>Sin datos</span></div></section>`;

  // afectaciones
  const fue = R.lista.filter(p => p.estado === 'FUE'), con = R.lista.filter(p => p.estado === 'CON');
  h += `<section><h2>Fuera de servicio <span class="meta">${fue.length} puntos · ${fue.reduce((a,p)=>a+p.cams.length,0)} cámaras</span></h2>`;
  h += fue.length ? `<div class="list">${fue.map(p => itemPunto(p, R, nt, false)).join('')}</div>` : `<div class="empty">No hay puntos fuera de servicio.</div>`;
  h += `</section><section><h2>Con novedad <span class="meta">${con.length} puntos · ${con.reduce((a,p)=>a+p.apa,0)} cámaras apagadas</span></h2>`;
  h += con.length ? `<div class="list">${con.map(p => itemPunto(p, R, nt, true)).join('')}</div>` : `<div class="empty">No hay puntos con novedad.</div>`;
  h += `</section>`;

  // por municipio
  if (CATS[current].municipios){
    h += `<section><h2>Por municipio <span class="meta">toca un municipio para filtrar</span></h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Municipio</th><th>Cámaras</th><th>Enc.</th><th>Apag.</th><th>%</th><th>Fuera</th><th>Novedad</th></tr></thead><tbody>`;
    let T = {c:0,e:0,a:0,f:0,n:0};
    CATS[current].municipios.forEach(m => {
      const ps = R.lista.filter(p => p.mun === m);
      const c = ps.reduce((a,p)=>a+p.cams.length,0), e = ps.reduce((a,p)=>a+p.enc,0), a = ps.reduce((x,p)=>x+p.apa,0);
      const f = ps.filter(p=>p.estado==='FUE').length, n = ps.filter(p=>p.estado==='CON').length;
      T.c+=c; T.e+=e; T.a+=a; T.f+=f; T.n+=n;
      h += `<tr class="click" data-mun="${esc(m)}"><td>${esc(m)}</td><td>${c}</td><td class="g">${e}</td><td class="${a?'r':''}">${a}</td><td>${pct(e,c)}</td><td class="${f?'r':''}">${f}</td><td>${n}</td></tr>`;
    });
    h += `</tbody><tfoot><tr><td>Total</td><td>${T.c}</td><td>${T.e}</td><td>${T.a}</td><td>${pct(T.e,T.c)}</td><td>${T.f}</td><td>${T.n}</td></tr></tfoot></table></div></section>`;
  }

  // por tipo
  h += `<section><h2>Por tipo de cámara</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Tipo</th><th>Encendidas</th><th>Apagadas</th><th>Total</th><th>%</th></tr></thead><tbody>`;
  [['PTZ','PTZ'],['FIJA','Fijas'],['LPR','LPR']].forEach(([k,l]) => { const t = R.tipos[k]; if (!t.t) return;
    h += `<tr><td>${l}</td><td class="g">${t.e}</td><td class="${t.a?'r':''}">${t.a}</td><td>${t.t}</td><td>${pct(t.e,t.t)}</td></tr>`; });
  h += `</tbody><tfoot><tr><td>Total</td><td>${R.enc}</td><td>${R.apa}</td><td>${tot}</td><td>${pct(R.enc,tot)}</td></tr></tfoot></table></div></section>`;

  // cambios
  if (rep.prev){
    const antes = {}; rep.prev.rows.forEach(r => antes[r.Nombre] = (r.Estado||'').toUpperCase());
    const cambios = rep.rows.filter(r => antes[r.Nombre] && antes[r.Nombre] !== (r.Estado||'').toUpperCase());
    h += `<section><h2>Cambios <span class="meta">desde el reporte del ${esc(fechaTxt(rep.prev.fecha))}</span></h2>`;
    h += cambios.length ? `<div class="list">${cambios.map(r => { const on = (r.Estado||'').toUpperCase()==='ENCENDIDA';
      return `<div class="item"><div class="top"><span class="name">${esc(r.Nombre)}</span><span class="pill ${on?'ok':'bad'}">${on?'Se encendió':'Se apagó'}</span></div></div>`; }).join('')}</div>`
      : `<div class="empty">Ninguna cámara cambió de estado.</div>`;
    h += `</section>`;
  }
  h += `<p class="sub" style="margin-top:26px">Los reportes y las causas se guardan solo en este teléfono.</p>`;
  main.innerHTML = h;

  // eventos
  document.querySelectorAll('.st').forEach(b => b.onclick = () => { filtro = (filtro === b.dataset.f) ? null : b.dataset.f; render(); document.getElementById('wall').scrollIntoView({block:'start'}); });
  document.querySelectorAll('.tile,.item[data-i]').forEach(b => b.onclick = () => abrir(R.lista[+b.dataset.i]));
  document.querySelectorAll('tr.click').forEach(t => t.onclick = () => { munFiltro = (munFiltro === t.dataset.mun) ? null : t.dataset.mun; render(); document.getElementById('wall').scrollIntoView({block:'start'}); });
  const q = $('#q'); q.oninput = () => { busqueda = q.value; aplicarFiltro(); };
  const clr = $('#clr'); if (clr) clr.onclick = () => { filtro = null; munFiltro = null; render(); };
  aplicarFiltro();
  $('#share').onclick = () => compartir(R, rep);
}

function itemPunto(p, R, nt, soloApagadas){
  const i = R.lista.indexOf(p);
  const tipos = [p.ptz?`${p.ptz} PTZ`:'', p.fija?`${p.fija} fija${p.fija>1?'s':''}`:'', p.lpr?`${p.lpr} LPR`:''].filter(Boolean).join(', ');
  const off = p.cams.filter(c => c.estado === 'APAGADA').map(c => c.nombre + (c.tipo==='PTZ'?' (PTZ)':''));
  return `<button class="item" type="button" data-i="${i}"><div class="top"><span class="name">${esc(p.nombre)}</span><span class="cnt">${soloApagadas?`${p.apa} de ${p.cams.length} apagadas`:tipos}</span></div>
    ${soloApagadas?`<div class="cams">${esc(off.join(' · '))}</div>`:''}
    ${nt[p.nombre]?`<div class="note">Causa: ${esc(nt[p.nombre])}</div>`:''}</button>`;
}

function aplicarFiltro(){
  const q = busqueda.trim().toUpperCase();
  document.querySelectorAll('.tile').forEach(t => {
    const ok = (!filtro || t.dataset.e === filtro) && (!munFiltro || t.dataset.mun === munFiltro) && (!q || t.dataset.s.includes(q));
    t.classList.toggle('hide', !ok);
  });
  document.querySelectorAll('.mungroup').forEach(g => {
    let n = g.nextElementSibling, vis = false;
    while (n && !n.classList.contains('mungroup')){ if (!n.classList.contains('hide')) { vis = true; break; } n = n.nextElementSibling; }
    g.style.display = vis ? '' : 'none';
  });
}

function abrir(p){
  const nt = notas();
  const cams = p.cams.map(c => {
    const cls = c.estado==='ENCENDIDA'?'on':(c.estado==='APAGADA'?'off':'nd');
    const txt = c.estado==='ENCENDIDA'?'Encendida':(c.estado==='APAGADA'?'Apagada':(c.estado||'Sin dato'));
    return `<div class="cam"><div><div class="cn">${esc(c.nombre)}</div><div class="ci">${esc(c.tipo)} · ${esc(c.ip||'sin IP')} · ping ${esc(c.ping||'-')} · web ${esc(c.web||'-')} · RTSP ${esc(c.rtsp||'-')}</div></div><span class="cs ${cls}">${txt}</span></div>`;
  }).join('');
  $('#sheet').innerHTML = `<h3 id="dlgTitle">${esc(p.nombre)}</h3><div class="sub">${p.mun?esc(p.mun)+' · ':''}${ST[p.estado]} · ${p.enc} encendidas, ${p.apa} apagadas</div>${cams}
    <label class="nl" for="nota">Causa novedad</label><textarea id="nota" placeholder="Ej.: corte de energía, fibra cortada, cámara en mantenimiento">${esc(nt[p.nombre]||'')}</textarea>
    <div class="sheetbtns"><button class="btn" id="guardar" type="button">Guardar causa</button><button class="btn ghost" id="cerrar" type="button">Cerrar</button></div>`;
  const d = $('#dlg'); d.showModal();
  $('#cerrar').onclick = () => d.close();
  $('#guardar').onclick = () => { const n = notas(); const v = $('#nota').value.trim(); if (v) n[p.nombre] = v; else delete n[p.nombre];
    store.set('cctv:notas:' + current, n) ? toast('Causa guardada') : toast('No se pudo guardar en este teléfono'); d.close(); render(); };
}
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') e.target.close(); });

async function compartir(R, rep){
  const nt = notas();
  const tot = R.enc + R.apa + R.nd;
  let t = `ESTADO CCTV ${CATS[current].nombre.toUpperCase()} – ${fechaTxt(rep.fecha)}\n`;
  t += `Cámaras: ${tot} | Encendidas ${R.enc} (${pct(R.enc,tot)}) | Apagadas ${R.apa} (${pct(R.apa,tot)})\n`;
  t += `Puntos: ${R.lista.length} | Sin novedad ${R.cuenta.SIN} | Con novedad ${R.cuenta.CON} | Fuera de servicio ${R.cuenta.FUE}\n`;
  const fue = R.lista.filter(p=>p.estado==='FUE'), con = R.lista.filter(p=>p.estado==='CON');
  if (fue.length){ t += `\nFUERA DE SERVICIO (${fue.length}):\n` + fue.map(p => `- ${p.nombre} (${p.cams.length} cám.)${nt[p.nombre]?' – '+nt[p.nombre]:''}`).join('\n') + '\n'; }
  if (con.length){ t += `\nCON NOVEDAD (${con.length}):\n` + con.map(p => `- ${p.nombre}: ${p.cams.filter(c=>c.estado==='APAGADA').map(c=>c.nombre).join(', ')}${nt[p.nombre]?' – '+nt[p.nombre]:''}`).join('\n') + '\n'; }
  try { if (navigator.share){ await navigator.share({text:t}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(t); toast('Resumen copiado, pégalo en WhatsApp o correo'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Resumen copiado'); }catch(_){ toast('No se pudo copiar'); } ta.remove(); }
}

/* ---------- cargar archivo ---------- */
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const rows = parseCSV(String(rd.result));
    e.target.value = '';
    if (!rows.length || !('Nombre' in rows[0]) || !('Estado' in rows[0])){ toast('El archivo no tiene las columnas Nombre y Estado'); return; }
    const k = detectarSistema(rows);
    if (!k){ toast('No reconozco estas cámaras en ningún sistema'); return; }
    const fecha = (rows.find(r => r.Revisado) || {}).Revisado || f.name;
    const antes = store.get('cctv:rep:' + k);
    const rep = {fecha, archivo:f.name, rows};
    if (antes && antes.fecha !== fecha) rep.prev = {fecha: antes.fecha, rows: antes.rows.map(r => ({Nombre:r.Nombre, Estado:r.Estado}))};
    else if (antes && antes.prev) rep.prev = antes.prev;
    if (!store.set('cctv:rep:' + k, rep)) toast('El reporte se ve, pero no se pudo guardar en el teléfono');
    else toast(`Reporte de ${CATS[k].nombre} cargado`);
    current = k; store.set('cctv:sel', k); filtro = null; munFiltro = null; busqueda = '';
    render(); window.scrollTo(0,0);
  };
  rd.onerror = () => toast('No se pudo leer el archivo');
  rd.readAsText(f, 'utf-8');
});

render();
</script>
