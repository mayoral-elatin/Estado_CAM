<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#203868">
<title>Estado de cámaras CCTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F8; --surface:#FFFFFF; --ink:#1B2B48; --ink-2:#4A5D70; --line:#D3DCE4;
  --ok:#23845A; --ok-bg:#DDF1E6; --warn:#B7790F; --warn-bg:#FBEFD2; --bad:#C23B2E; --bad-bg:#F9DEDA;
  --nodata:#8C9AA8; --nodata-bg:#E3E8ED; --accent:#0860A8;
  --brand:#203868; --brand-2:#0860A8; --cyan:#00A8E8; --on-brand:#FFFFFF;
  --r-sm:6px; --r-md:12px;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A25; --surface:#172533; --ink:#E6EDF3; --ink-2:#9FB0C0; --line:#2A3B4C;
    --ok:#4CC38A; --ok-bg:#163A2B; --warn:#E6B047; --warn-bg:#3D3016; --bad:#F0705F; --bad-bg:#43211D;
    --nodata:#7D8C9A; --nodata-bg:#243444; --accent:#5CC4F0;
    --brand:#1C5DA8; --brand-2:#2E7BD0; --cyan:#00A8E8; --on-brand:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A25; --surface:#172533; --ink:#E6EDF3; --ink-2:#9FB0C0; --line:#2A3B4C;
  --ok:#4CC38A; --ok-bg:#163A2B; --warn:#E6B047; --warn-bg:#3D3016; --bad:#F0705F; --bad-bg:#43211D;
  --nodata:#7D8C9A; --nodata-bg:#243444; --accent:#5CC4F0;
    --brand:#1C5DA8; --brand-2:#2E7BD0; --cyan:#00A8E8; --on-brand:#FFFFFF;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
.brand{display:flex;align-items:center;gap:14px;padding:14px 0 12px;position:relative}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand-2) 55%,var(--cyan) 100%)}
.plate{background:#FFFFFF;border-radius:10px;padding:6px 10px;display:flex;align-items:center;box-shadow:0 1px 0 var(--line)}
.plate img{display:block;height:44px;width:auto}
.bt{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;color:var(--brand)}
.bs{font-size:13.5px;color:var(--ink-2);letter-spacing:.3px;text-transform:uppercase}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bt{color:var(--ink)}}
:root[data-theme="dark"] .bt{color:var(--ink)}

/* barra de sistemas */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.systems{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.systems::-webkit-scrollbar{display:none}
.sys{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;cursor:pointer;display:flex;gap:6px;align-items:center}
.sys[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sys .dot{width:8px;height:8px;border-radius:50%;background:var(--nodata)}
.sys .dot.on{background:var(--ok)}
.load{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.load label.btn{flex:1 1 100%}
.load .btn.ghost{flex:1 1 40%}
.btn{border:0;border-radius:var(--r-md);padding:12px 16px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--on-brand);flex:1;text-align:center}
.btn:active{background:var(--brand-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding:12px 12px}
input[type=file]{display:none}

/* encabezado del estado */
.hero{padding:22px 2px 6px}
.hero h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;color:var(--ink-2);letter-spacing:.2px}
.count{color:var(--brand);font-family:var(--display);font-weight:700;font-size:64px;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.count small{font-size:30px;color:var(--ink-2);font-weight:600}
.sub{color:var(--ink-2);font-size:15px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--nodata-bg);margin:14px 0 4px}
.bar span{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-bad{background:var(--bad)}
.barlegend{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.barlegend b{color:var(--ink);font-variant-numeric:tabular-nums}

/* estados de puntos */
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.st{border-radius:var(--r-md);padding:10px 10px 9px;border:2px solid transparent;cursor:pointer;text-align:left;background:var(--surface)}
.st .n{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.st .l{font-size:13px;line-height:1.2;color:var(--ink-2);margin-top:3px}
.st.ok .n{color:var(--ok)} .st.warn .n{color:var(--warn)} .st.bad .n{color:var(--bad)}
.st[aria-pressed="true"]{border-color:currentColor}
.st.ok[aria-pressed="true"]{border-color:var(--ok)} .st.warn[aria-pressed="true"]{border-color:var(--warn)} .st.bad[aria-pressed="true"]{border-color:var(--bad)}

section{margin-top:26px}
h2{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;margin:0 0 10px;padding-left:10px;border-left:4px solid var(--cyan)}
h2 .meta{display:block;font-family:var(--body);font-size:14px;font-weight:500;color:var(--ink-2);margin-top:3px}

/* muro de puntos */
.tools{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px}
.tile{position:relative;border:0;border-radius:var(--r-sm);padding:7px 4px 6px;cursor:pointer;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tile .c{font-family:var(--display);font-weight:700;font-size:19px;line-height:1}
.tile .m{font-size:10.5px;line-height:1.15;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .f{font-size:11px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad);color:#fff}
.t-nodata{background:var(--nodata-bg);color:var(--nodata)}
.tile.hide{display:none}
.tile .nd{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.t-bad .nd{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.mungroup{grid-column:1/-1;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink-2);margin:8px 0 1px}
.mungroup:first-child{margin-top:0}

/* tablas */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r-md);overflow:hidden;font-size:15px}
.tblwrap{overflow-x:auto;border-radius:var(--r-md)}
.tbl th,.tbl td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--on-brand);background:var(--brand);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700}
.tbl td.g{color:var(--ok);font-weight:600} .tbl td.r{color:var(--bad);font-weight:600}
.tbl tr.click{cursor:pointer}

/* listas de afectaciones */
.list{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.item{display:block;width:100%;border:0;background:none;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .name{font-weight:600}
.item .cnt{font-size:14px;color:var(--ink-2);white-space:nowrap}
.item .cams{font-size:14px;color:var(--bad);margin-top:3px}
.item .note{font-size:14px;color:var(--ink-2);margin-top:4px;font-style:italic}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.empty{background:var(--surface);border-radius:var(--r-md);padding:18px;color:var(--ink-2)}
.warnbox{background:var(--warn-bg);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;margin-top:14px;font-size:15px}

/* estado vacío */
.intro{padding:36px 4px 10px}
.intro h1{font-family:var(--display);font-size:34px;line-height:1.1;margin:0 0 10px}
.intro p{color:var(--ink-2);margin:0 0 10px;max-width:60ch}
.intro ol{color:var(--ink-2);padding-left:20px;margin:6px 0 0}

/* detalle del punto */
dialog{border:0;border-radius:16px 16px 0 0;padding:0;width:100%;max-width:760px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(10,20,30,.45)}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:88vh}
.sheet h3{font-family:var(--display);font-weight:600;font-size:26px;margin:0}
.sheet .sub{margin-bottom:12px}
.cam{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cam .cn{font-weight:600;font-size:15px}
.cam .ci{font-size:13px;color:var(--ink-2)}
.cam .cs{font-weight:700;font-size:13px;border-radius:6px;padding:3px 8px;white-space:nowrap}
.cs{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:6px 10px !important}
.cs::after{content:"⇄";font-weight:600;opacity:.7}
.cam .man{font-size:12.5px;color:var(--warn);font-weight:600;margin-top:2px}
.hint{font-size:13.5px;color:var(--ink-2);margin:-4px 0 6px}
.undo{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.cs.on{background:var(--ok-bg);color:var(--ok)} .cs.off{background:var(--bad-bg);color:var(--bad)} .cs.nd{background:var(--nodata-bg);color:var(--nodata)}
label.nl{display:block;font-weight:600;margin:16px 0 6px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;background:var(--bg)}
.sheetbtns{display:flex;gap:8px;margin-top:12px}
.redcard{background:var(--surface);border-radius:var(--r-md);padding:8px;margin-bottom:10px;overflow:hidden}
.redcard svg{width:100%;height:auto;display:block}
.redsvg{overflow-x:auto;-webkit-overflow-scrolling:touch}.redsvg svg{max-width:none;height:auto}
.redhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:15px}
.item.hall{cursor:default}
.swt td.dg{white-space:normal;text-align:left;min-width:220px}.swt td.w{color:var(--warn);font-weight:600}
.swt td:nth-child(1){white-space:normal;min-width:120px}
.item.hall.NODO,.item.hall.PRINCIPAL{border-left:5px solid var(--bad)}
.item.hall.ANILLO,.item.hall.TRAMO{border-left:5px solid var(--bad)}
.item.hall.RAMAL,.item.hall.PUNTO{border-left:5px solid var(--warn)}
.item.hall.DEPENDIENTE{border-left:5px solid var(--nodata)}
[data-nodo] circle,[data-stop] circle{transition:transform .15s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .count{color:var(--ink)}}
:root[data-theme="dark"] .count{color:var(--ink)}
@media (min-width:600px){.count{font-size:80px}.wall{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}}
</style>
</head>

/* SVG -> PNG (para Excel) */
function svgAPng(svg, W, H, escala=2){
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => { try { const cv = document.createElement('canvas'); cv.width = W*escala; cv.height = H*escala; const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height); ok(cv.toDataURL('image/png')); } catch(e){ fail(e); } };
    img.onerror = fail;
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  });
}

};

/* ---------- lectura del CSV ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.split(';').length > first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep){ row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r'){
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else field += ch;
  }
  if (field !== '' || row.length){ row.push(field); if (row.some(x => x.trim() !== '')) rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => { const o = {}; head.forEach((h,i) => o[h] = (r[i] || '').trim()); return o; });
}

function detectarSistema(rows){
  let mejor = null, max = 0;
  for (const k of ORDER){
    const cat = CATS[k]; const nombres = new Set(cat.cams.map(c => c[0])); const alias = cat.alias || {};
    let n = 0; rows.forEach(r => { const nm = alias[r.Nombre] || r.Nombre; if (nombres.has(nm)) n++; });
    if (n > max){ max = n; mejor = k; }
  }
  return (mejor && max >= rows.length * 0.5) ? mejor : null;
}

/* ---------- cálculo del resumen ---------- */
function calcular(key, rep){
  const cat = CATS[key]; const alias = cat.alias || {};
  const info = {}; cat.cams.forEach(c => info[c[0]] = {punto:c[1], tipo:c[2], mun:c[3] || ''});
  const puntos = {}; cat.puntos.forEach(p => puntos[p] = {nombre:p, mun:'', cams:[], enc:0, apa:0, ptz:0, fija:0, lpr:0});
  cat.cams.forEach(c => { if (c[3]) puntos[c[1]].mun = c[3]; });
  const sinPunto = [];
  const tipos = {PTZ:{e:0,a:0,t:0}, FIJA:{e:0,a:0,t:0}, LPR:{e:0,a:0,t:0}};
  let enc = 0, apa = 0, nd = 0;
  rep.rows.forEach(r => {
    const nm = alias[r.Nombre] || r.Nombre; const inf = info[nm];
    const estado = (r.Estado || '').toUpperCase();
    const cam = {nombre:nm, orig:r.Nombre, manual:r.Manual||null, ip:r.IP, estado, ping:r.Responde_Ping, web:r.Puerto_Web_80, rtsp:r.Puerto_RTSP, tipo: inf ? inf.tipo : '?'};
    if (estado === 'ENCENDIDA') enc++; else if (estado === 'APAGADA') apa++; else nd++;
    if (inf && tipos[inf.tipo]){ tipos[inf.tipo].t++; if (estado === 'ENCENDIDA') tipos[inf.tipo].e++; else if (estado === 'APAGADA') tipos[inf.tipo].a++; }
    if (!inf || !puntos[inf.punto]){ sinPunto.push(cam); return; }
    const p = puntos[inf.punto]; p.cams.push(cam);
    if (estado === 'ENCENDIDA') p.enc++; else if (estado === 'APAGADA') p.apa++;
    if (inf.tipo === 'PTZ') p.ptz++; else if (inf.tipo === 'LPR') p.lpr++; else p.fija++;
  });
  const lista = cat.puntos.map(n => puntos[n]);
  lista.forEach(p => { p.estado = (p.enc + p.apa === 0) ? 'ND' : (p.enc === 0 ? 'FUE' : (p.apa === 0 ? 'SIN' : 'CON')); });
  const cuenta = {SIN:0, CON:0, FUE:0, ND:0}; lista.forEach(p => cuenta[p.estado]++);
  return {lista, cuenta, tipos, enc, apa, nd, total: rep.rows.length, sinPunto};
}

function codigo(p){

  if (!m) return {c: p.slice(0,4), m: p};

}

  const q = $('#q'); q.oninput = () => { busqueda = q.value; aplicarFiltro(); };
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => deshacerCambio(b.dataset.undo));
  const clr = $('#clr'); if (clr) clr.onclick = () => { filtro = null; munFiltro = null; render(); };
  aplicarFiltro();
  eventosRed(R);
  $('#share').onclick = () => compartir(R, rep);
  $('#xls').onclick = () => descargarExcel(R, rep);
}

function itemPunto(p, R, nt, soloApagadas){
  const i = R.lista.indexOf(p);
  const tipos = [p.ptz?`${p.ptz} PTZ`:'', p.fija?`${p.fija} fija${p.fija>1?'s':''}`:'', p.lpr?`${p.lpr} LPR`:''].filter(Boolean).join(', ');
  const off = p.cams.filter(c => c.estado === 'APAGADA').map(c => c.nombre + (c.tipo==='PTZ'?' (PTZ)':''));
  return `<button class="item" type="button" data-i="${i}"><div class="top"><span class="name">${esc(p.nombre)}</span><span class="cnt">${soloApagadas?`${p.apa} de ${p.cams.length} apagadas`:tipos}</span></div>
    ${nodoDePunto(p.nombre)?`<div class="note" style="font-style:normal">Nodo ${esc(nodoDePunto(p.nombre))}</div>`:''}
    ${soloApagadas?`<div class="cams">${esc(off.join(' · '))}</div>`:''}
    ${nt[p.nombre]?`<div class="note">Causa: ${esc(nt[p.nombre])}</div>`:''}</button>`;
}

function aplicarFiltro(){
  const q = busqueda.trim().toUpperCase();
  document.querySelectorAll('.tile').forEach(t => {
    const ok = (!filtro || t.dataset.e === filtro) && (!munFiltro || t.dataset.mun === munFiltro) && (!q || t.dataset.s.includes(q));
    t.classList.toggle('hide', !ok);
  });
  document.querySelectorAll('.mungroup').forEach(g => {
    let n = g.nextElementSibling, vis = false;
    while (n && !n.classList.contains('mungroup')){ if (!n.classList.contains('hide')) { vis = true; break; } n = n.nextElementSibling; }
    g.style.display = vis ? '' : 'none';
  });
}

function abrir(p){
  const nt = notas();
  const cams = p.cams.map(c => {
    const cls = c.estado==='ENCENDIDA'?'on':(c.estado==='APAGADA'?'off':'nd');
    const txt = c.estado==='ENCENDIDA'?'Encendida':(c.estado==='APAGADA'?'Apagada':(c.estado||'Sin dato'));
    const man = c.manual ? `<div class="man">Cambiado a mano el ${esc(c.manual.fecha)} (el reporte decía ${c.manual.antes==='ENCENDIDA'?'encendida':'apagada'})</div>` : '';
    return `<div class="cam"><div><div class="cn">${esc(c.nombre)}</div><div class="ci">${esc(c.tipo)} · ${esc(c.ip||'sin IP')} · ping ${esc(c.ping||'-')} · web ${esc(c.web||'-')} · RTSP ${esc(c.rtsp||'-')}</div>${man}</div>
      <button class="cs ${cls}" type="button" data-orig="${esc(c.orig)}" aria-label="${esc(c.nombre)}: ${txt}. Toca para cambiar el estado">${txt}</button></div>`;
  }).join('');
  $('#sheet').innerHTML = `<h3 id="dlgTitle">${esc(p.nombre)}</h3><div class="sub">${p.mun?esc(p.mun)+' · ':''}${ST[p.estado]} · ${p.enc} encendidas, ${p.apa} apagadas</div><p class="hint">Si se solucionó una novedad, toca el estado de la cámara para cambiarlo.</p>${cams}
    <label class="nl" for="nota">Causa novedad</label><textarea id="nota" placeholder="Ej.: corte de energía, fibra cortada, cámara en mantenimiento">${esc(nt[p.nombre]||'')}</textarea>
    <div class="sheetbtns"><button class="btn" id="guardar" type="button">Guardar causa</button><button class="btn ghost" id="cerrar" type="button">Cerrar</button></div>`;
  const d = $('#dlg'); if (!d.open) d.showModal();
  $('#cerrar').onclick = () => d.close();
  document.querySelectorAll('#sheet .cs').forEach(b => b.onclick = () => {
    const borrador = $('#nota').value;
    cambiarEstado(b.dataset.orig);
    const np = ultimoR.lista.find(x => x.nombre === p.nombre);
    abrir(np); $('#nota').value = borrador;
  });
  $('#guardar').onclick = () => { const n = notas(); const v = $('#nota').value.trim(); if (v) n[p.nombre] = v; else delete n[p.nombre];
    store.set('cctv:notas:' + current, n) ? toast('Causa guardada') : toast('No se pudo guardar en este teléfono'); d.close(); render(); };
}
function ahora(){ const d = new Date(); const z = n => String(n).padStart(2,'0'); return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function cambiarEstado(orig, forzar){
  const rep = store.get('cctv:rep:' + current); if (!rep) return;
  const r = rep.rows.find(x => x.Nombre === orig); if (!r) return;
  const nuevo = forzar || (r.Estado === 'ENCENDIDA' ? 'APAGADA' : 'ENCENDIDA');
  if (r.Manual && r.Manual.antes === nuevo){ delete r.Manual; }
  else if (!r.Manual){ r.Manual = {antes: r.Estado, fecha: ahora()}; }
  else { r.Manual.fecha = ahora(); }
  r.Estado = nuevo;
  store.set('cctv:rep:' + current, rep) ? toast(`${orig}: ${nuevo === 'ENCENDIDA' ? 'encendida' : 'apagada'}`) : toast('No se pudo guardar el cambio');
  render();
}
function deshacerCambio(orig){
  const rep = store.get('cctv:rep:' + current); if (!rep) return;
  const r = rep.rows.find(x => x.Nombre === orig); if (!r || !r.Manual) return;
  r.Estado = r.Manual.antes; delete r.Manual;
  store.set('cctv:rep:' + current, rep); toast('Cambio deshecho'); render();
}

function construirLibro(R, rep){
  const nt = notas(); const cat = CATS[current]; const conMun = !!cat.municipios;
  const tot = R.enc + R.apa + R.nd;
  const P = (a,b) => b ? a/b : 0;
  const hojaDesde = (aoa, anchos, pctCeldas) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = anchos.map(w => ({wch:w}));
    (pctCeldas || []).forEach(ref => { if (ws[ref]) ws[ref].z = '0.0%'; });
    return ws;
  };
  const A = []; const pc = [];
  const add = fila => { A.push(fila); return A.length; };
  const cel = (col, fila) => XLSX.utils.encode_cell({c:col, r:fila-1});
  add([`RESUMEN DE ESTADO DE CÁMARAS – CCTV ${cat.nombre.toUpperCase()}`]);
  add(['Fecha del reporte:', rep.fecha]);
  const nMan = rep.rows.filter(r => r.Manual).length;
  if (nMan) add(['Cambios de estado hechos a mano:', nMan, 'Ver columna "Cambio manual" en la hoja Reporte']);
  add([]);
  add(['Cámaras','Cantidad','%']);
  let f = add(['Total cámaras', tot, 1]); pc.push(cel(2,f));
  f = add(['Encendidas', R.enc, P(R.enc,tot)]); pc.push(cel(2,f));
  f = add(['Apagadas', R.apa, P(R.apa,tot)]); pc.push(cel(2,f));
  add([]);
  add(['Tipo de cámara','Encendidas','Apagadas','Total','% encendidas']);
  [['PTZ','PTZ'],['FIJA','Fijas'],['LPR','LPR']].forEach(([k,l]) => { const t = R.tipos[k]; f = add([l, t.e, t.a, t.t, P(t.e,t.t)]); pc.push(cel(4,f)); });
  f = add(['Total', R.enc, R.apa, tot, P(R.enc,tot)]); pc.push(cel(4,f));
  add([]);
  const np = R.lista.length;
  add(['Puntos','Cantidad','%']);
  f = add(['Total puntos', np, 1]); pc.push(cel(2,f));
  f = add(['Encendidos sin novedad (todas encendidas)', R.cuenta.SIN, P(R.cuenta.SIN,np)]); pc.push(cel(2,f));
  f = add(['Encendidos con novedad (alguna apagada)', R.cuenta.CON, P(R.cuenta.CON,np)]); pc.push(cel(2,f));
  f = add(['Fuera de servicio (todas apagadas)', R.cuenta.FUE, P(R.cuenta.FUE,np)]); pc.push(cel(2,f));
  if (conMun){
    add([]); add(['TOTAL POR MUNICIPIO']);
    add(['Municipio','Puntos','Cámaras','Encendidas','Apagadas','% encendidas','Sin novedad','Con novedad','Fuera de servicio']);
    const T = [0,0,0,0,0,0,0];
    cat.municipios.forEach(m => {
      const ps = R.lista.filter(p => p.mun === m);
      const v = [ps.length, ps.reduce((a,p)=>a+p.cams.length,0), ps.reduce((a,p)=>a+p.enc,0), ps.reduce((a,p)=>a+p.apa,0),
                 ps.filter(p=>p.estado==='SIN').length, ps.filter(p=>p.estado==='CON').length, ps.filter(p=>p.estado==='FUE').length];
      v.forEach((x,i) => T[i]+=x);
      f = add([m, v[0], v[1], v[2], v[3], P(v[2],v[1]), v[4], v[5], v[6]]); pc.push(cel(5,f));
    });
    f = add(['TOTAL GENERAL', T[0], T[1], T[2], T[3], P(T[2],T[1]), T[4], T[5], T[6]]); pc.push(cel(5,f));
  }
  add([]); add(['PUNTOS FUERA DE SERVICIO']);
  add(conMun ? ['N°','Punto','Municipio','PTZ','Fijas','LPR','Total cámaras','Causa novedad'] : ['N°','Punto','PTZ','Fijas','LPR','Total cámaras','Causa novedad']);
  const fue = R.lista.filter(p => p.estado === 'FUE');
  fue.forEach((p,i) => add(conMun ? [i+1, p.nombre, p.mun, p.ptz, p.fija, p.lpr, p.cams.length, nt[p.nombre]||''] : [i+1, p.nombre, p.ptz, p.fija, p.lpr, p.cams.length, nt[p.nombre]||'']));
  if (fue.length) add(conMun ? ['','Total','', fue.reduce((a,p)=>a+p.ptz,0), fue.reduce((a,p)=>a+p.fija,0), fue.reduce((a,p)=>a+p.lpr,0), fue.reduce((a,p)=>a+p.cams.length,0)]
                               : ['','Total', fue.reduce((a,p)=>a+p.ptz,0), fue.reduce((a,p)=>a+p.fija,0), fue.reduce((a,p)=>a+p.lpr,0), fue.reduce((a,p)=>a+p.cams.length,0)]);
  else add(['','Ninguno']);
  add([]); add(['PUNTOS ENCENDIDOS CON NOVEDAD – CÁMARAS APAGADAS']);
  add(conMun ? ['N°','Municipio','Punto','Cámara apagada','Tipo','Causa novedad'] : ['N°','Punto','Cámara apagada','Tipo','Causa novedad']);
  let n = 0;
  R.lista.filter(p => p.estado === 'CON').forEach(p => p.cams.filter(c => c.estado === 'APAGADA').forEach(c => {
    n++; add(conMun ? [n, p.mun, p.nombre, c.nombre, c.tipo, nt[p.nombre]||''] : [n, p.nombre, c.nombre, c.tipo, nt[p.nombre]||'']);
  }));
  if (!n) add(['','Ninguno']);
  const wsRes = hojaDesde(A, conMun ? [8,44,16,14,12,14,12,14,45] : [44,40,40,12,12,45], pc);

  // Hoja Puntos
  const B = [conMun ? ['Municipio','Punto','PTZ','Fijas','LPR','Total cámaras','Encendidas','Apagadas','Estado del punto','Causa novedad']
                    : ['Punto','PTZ','Fijas','LPR','Total cámaras','Encendidas','Apagadas','Estado del punto','Causa novedad']];
  const EST = {SIN:'ENCENDIDO SIN NOVEDAD', CON:'ENCENDIDO CON NOVEDAD', FUE:'FUERA DE SERVICIO', ND:'SIN DATOS'};
  const S = [0,0,0,0,0,0];
  R.lista.forEach(p => {
    const v = [p.ptz, p.fija, p.lpr, p.cams.length, p.enc, p.apa]; v.forEach((x,i) => S[i]+=x);
    B.push((conMun ? [p.mun, p.nombre] : [p.nombre]).concat(v, [EST[p.estado], nt[p.nombre]||'']));
  });
  B.push((conMun ? ['', 'TOTAL'] : ['TOTAL']).concat(S, [R.lista.length + ' puntos', '']));
  if (R.sinPunto.length) B.push((conMun ? ['', 'Cámaras sin punto asignado'] : ['Cámaras sin punto asignado']).concat(['','','', R.sinPunto.length]));
  const wsPts = hojaDesde(B, conMun ? [13,44,7,7,7,12,12,12,24,45] : [40,7,7,7,12,12,12,24,45]);

  // Hoja Reporte
  const info = {}; cat.cams.forEach(c => info[c[0]] = c);
  const alias = cat.alias || {};
  const C = [(conMun ? ['Municipio'] : []).concat(['Nombre','IP','Estado','Responde_Ping','Puerto_Web_80','Puerto_RTSP','Revisado','Punto','Tipo','Cambio manual'])];
  rep.rows.forEach(r => { const i = info[alias[r.Nombre] || r.Nombre];
    C.push((conMun ? [r.Municipio || (i ? i[3] : '')] : []).concat([r.Nombre, r.IP, r.Estado, r.Responde_Ping, r.Puerto_Web_80, r.Puerto_RTSP, r.Revisado, i ? i[1] : 'NO EN CATALOGO', i ? i[2] : '', r.Manual ? `Sí, ${r.Manual.fecha} (reporte: ${r.Manual.antes})` : ''])); });
  const wsRep = hojaDesde(C, (conMun ? [13] : []).concat([40,16,12,12,12,12,20,40,8,34]));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resumen');
  XLSX.utils.book_append_sheet(wb, wsPts, 'Puntos');
  XLSX.utils.book_append_sheet(wb, wsRep, 'Reporte');
  return wb;
}

/* ---------- Excel con colores (ExcelJS, se carga solo al descargar) ---------- */
function cargarScript(url){
  return new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = url; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
}
async function obtenerExcelJS(){
  if (window.ExcelJS) return window.ExcelJS;
  try { await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); } catch(e){ return null; }
  return window.ExcelJS || null;
}

async function construirLibroColor(ExcelJS, R, rep){
  const nt = notas(); const cat = CATS[current]; const conMun = !!cat.municipios;
  const tot = R.enc + R.apa + R.nd; const np = R.lista.length;
  const P = (a,b) => b ? a/b : 0;
  const C = {nav:'FF203868', azul2:'FF0860A8', cyan:'FF00A8E8', blanco:'FFFFFFFF', vf:'FFC6EFCE', vt:'FF006100', rf:'FFFFC7CE', rt:'FF9C0006', af:'FFFFEB9C', at:'FF9C5700',
             gf:'FFE7E6E6', gt:'FF595959', az:'FFD6EAF8', ent:'FFFFF2CC', linea:'FFBFBFBF'};
  const borde = {top:{style:'thin',color:{argb:C.linea}}, left:{style:'thin',color:{argb:C.linea}}, bottom:{style:'thin',color:{argb:C.linea}}, right:{style:'thin',color:{argb:C.linea}}};
  const fill = c => ({type:'pattern', pattern:'solid', fgColor:{argb:c}});
  const fuente = (o) => Object.assign({name:'Arial', size:10}, o || {});
  const EST = {SIN:'ENCENDIDO SIN NOVEDAD', CON:'ENCENDIDO CON NOVEDAD', FUE:'FUERA DE SERVICIO', ND:'SIN DATOS'};
  const colorEstado = v => ({'ENCENDIDO SIN NOVEDAD':[C.vf,C.vt], 'ENCENDIDA':[C.vf,C.vt], 'ENCENDIDO CON NOVEDAD':[C.af,C.at], 'FUERA DE SERVICIO':[C.rf,C.rt], 'APAGADA':[C.rf,C.rt], 'SIN DATOS':[C.gf,C.gt], 'NO EN CATALOGO':[C.gf,C.gt]})[v];

  const wb = new ExcelJS.Workbook(); wb.creator = 'Estado de cámaras CCTV';
  // helpers
  const encabezado = (ws, fila, col0) => { fila.eachCell({includeEmpty:false}, (c, n) => { if (n < col0) return;

async function descargarExcel(R, rep){
  const f = (rep.fecha.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/) || []);
  const sello = f.length ? `${f[1]}-${f[2]}-${f[3]}_${f[4].padStart(2,'0')}-${f[5]}` : new Date().toISOString().slice(0,10);
  const nombre = `RESUMEN CAMARAS ${CATS[current].nombre.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')} ${sello}.xlsx`;
  toast('Preparando el Excel…');
  let blob = null;
  const ExcelJS = await obtenerExcelJS();
  if (ExcelJS){
    try { const wb = await construirLibroColor(ExcelJS, R, rep); const buf = await wb.xlsx.writeBuffer(); blob = new Blob([buf]); }
    catch(e){ blob = null; }
  }
  if (!blob){
    if (typeof XLSX === 'undefined'){ toast('No se pudo generar el Excel. Revisa la conexión a internet.'); return; }
    blob = new Blob([XLSX.write(construirLibro(R, rep), {bookType:'xlsx', type:'array'})]);
    toast('Se generó el Excel sin colores');
  }
  if (dlPromise){
    let dl = null; try { dl = await dlPromise; } catch(e){ dl = null; }
    if (!dl){ toast('La descarga no está disponible en esta vista'); return; }
    try { await dl.save({filename: nombre, data: blob}); toast('Excel descargado'); }
    catch(e){ const code = e && e.code;
      if (code === 'declined') return;
      toast(code === 'rate_limited' ? 'Ya hay una descarga pendiente, espera un momento' : 'No se pudo descargar el Excel aquí'); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([blob], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Excel descargado');
  } catch(e){ toast('No se pudo descargar el Excel'); }
}

  const nt = notas();
  const tot = R.enc + R.apa + R.nd;
  let t = `ESTADO CCTV ${CATS[current].nombre.toUpperCase()} – ${fechaTxt(rep.fecha)}\n`;
  t += `Cámaras: ${tot} | Encendidas ${R.enc} (${pct(R.enc,tot)}) | Apagadas ${R.apa} (${pct(R.apa,tot)})\n`;
  const nm = rep.rows.filter(r => r.Manual).length;
  if (nm) t += `(Incluye ${nm} cambio${nm>1?'s':''} de estado hecho${nm>1?'s':''} a mano)\n`;
  t += `Puntos: ${R.lista.length} | Sin novedad ${R.cuenta.SIN} | Con novedad ${R.cuenta.CON} | Fuera de servicio ${R.cuenta.FUE}\n`;
  const fue = R.lista.filter(p=>p.estado==='FUE'), con = R.lista.filter(p=>p.estado==='CON');
  if (fue.length){ t += `\nFUERA DE SERVICIO (${fue.length}):\n` + fue.map(p => `- ${p.nombre} (${p.cams.length} cám.)${nt[p.nombre]?' – '+nt[p.nombre]:''}`).join('\n') + '\n'; }
  if (con.length){ t += `\nCON NOVEDAD (${con.length}):\n` + con.map(p => `- ${p.nombre}: ${p.cams.filter(c=>c.estado==='APAGADA').map(c=>c.nombre).join(', ')}${nt[p.nombre]?' – '+nt[p.nombre]:''}`).join('\n') + '\n'; }
  if (TOPO[current]){ const SWc = estadoSwitches(TOPO[current], rep); const D = diagnosticar(TOPO[current], estadoParadas(R, TOPO[current]), SWc);
    const swOff = TOPO[current].nodos.filter(n => SWc[n.id] && SWc[n.id].Estado === 'APAGADA');
    if (SWc.__hay) t += `\nSWITCHES DE NODO: ${TOPO[current].nodos.filter(n => SWc[n.id]).length - swOff.length} responden, ${swOff.length} no responden${swOff.length ? ' (' + swOff.map(n => n.nombre).join(', ') + ')' : ''}\n`;
    if (D.hall.length) t += `\nTRAMOS A REVISAR (${D.hall.length}):\n` + D.hall.map(x => `- ${x.txt} ${x.revisar}`).join('\n') + '\n'; }
  try { if (navigator.share){ await navigator.share({text:t}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(t); toast('Resumen copiado, pégalo en WhatsApp o correo'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Resumen copiado'); }catch(_){ toast('No se pudo copiar'); } ta.remove(); }
}

/* ---------- cargar archivo ---------- */
function guardarReporte(rows, nombreArchivo, causas){
  rows = rows.filter(r => (r.Nombre || '').trim() !== '');
  rows.forEach(r => { r.Nombre = r.Nombre.trim(); r.Estado = (r.Estado || '').trim().toUpperCase(); });
  const esSwitch = r => /^(SWITCH|GATEWAY|SERVIDOR)\b/i.test(r.Nombre);
  const switches = rows.filter(esSwitch).map(r => ({Nombre:r.Nombre, IP:(r.IP||'').trim(), Estado:r.Estado, Responde_Ping:r.Responde_Ping||'', Puerto_Web_80:r.Puerto_Web_80||'', Revisado:r.Revisado||''}));
  rows = rows.filter(r => !esSwitch(r));
  if (!rows.length || !('Estado' in rows[0])){ toast('El archivo no tiene las columnas Nombre y Estado'); return; }
  const k = detectarSistema(rows);
  if (!k){ toast('No reconozco estas cámaras en ningún sistema'); return; }
  if (!rows.some(r => r.Estado === 'ENCENDIDA' || r.Estado === 'APAGADA')){ toast('El archivo no trae el estado de las cámaras'); return; }
  const fecha = String((rows.find(r => r.Revisado) || {}).Revisado || nombreArchivo);
  const antes = store.get('cctv:rep:' + k);
  const rep = {fecha, archivo:nombreArchivo, switches, rows: rows.map(r => ({Municipio:r.Municipio||'', Nombre:r.Nombre, IP:r.IP||'', Estado:r.Estado, Responde_Ping:r.Responde_Ping||'', Puerto_Web_80:r.Puerto_Web_80||'', Puerto_RTSP:r.Puerto_RTSP||'', Revisado:r.Revisado||''}))};
  if (antes && antes.fecha !== fecha) rep.prev = {fecha: antes.fecha, rows: antes.rows.map(r => ({Nombre:r.Nombre, Estado:r.Estado}))};
  else if (antes && antes.prev) rep.prev = antes.prev;
  const okRep = store.set('cctv:rep:' + k, rep);
  let msg = `Reporte de ${CATS[k].nombre} cargado`;
  if (causas){
    const validos = new Set(CATS[k].puntos);
    const n = store.get('cctv:notas:' + k) || {}; let c = 0;
    Object.entries(causas).forEach(([p,v]) => { if (validos.has(p)){ n[p] = v; c++; } });
    store.set('cctv:notas:' + k, n);
    msg += c ? ` con ${c} causa${c>1?'s':''}` : ' (sin causas escritas)';
  }
  toast(okRep ? msg : 'El reporte se ve, pero no se pudo guardar en el teléfono');
  current = k; store.set('cctv:sel', k); filtro = null; munFiltro = null; busqueda = '';
  render(); window.scrollTo(0,0);
}

function leerExcel(buf, nombreArchivo){
  if (typeof XLSX === 'undefined'){ toast('No se pudo cargar el lector de Excel. Revisa la conexión a internet.'); return; }
  let wb;
  try { wb = XLSX.read(buf, {type:'array'}); } catch(e){ toast('No se pudo abrir el Excel'); return; }
  const hoja = n => wb.Sheets[wb.SheetNames.find(x => x.trim().toLowerCase() === n)];
  const wsRep = hoja('reporte');
  if (!wsRep){ toast('El Excel no tiene la hoja Reporte'); return; }
  const rows = XLSX.utils.sheet_to_json(wsRep, {defval:'', raw:false}).map(r => {
    const o = {}; Object.keys(r).forEach(h => o[h.trim()] = String(r[h]).trim()); return o; });
  let causas = null;
  const wsP = hoja('puntos');
  if (wsP){
    causas = {};
    XLSX.utils.sheet_to_json(wsP, {defval:'', raw:false}).forEach(r => {
      const o = {}; Object.keys(r).forEach(h => o[h.trim().toLowerCase()] = String(r[h]).trim());
      const p = o['punto'], c = o['causa novedad'];
      if (p && c && c !== '0') (causas[p] = causas[p] || new Set()).add(c);
    });
  }
  // Causas escritas directamente en las tablas de la hoja Resumen
  const wsR = hoja('resumen');
  if (wsR){
    causas = causas || {};
    const aoa = XLSX.utils.sheet_to_json(wsR, {header:1, defval:'', raw:false});
    const deResumen = {};
    aoa.forEach((fila, ri) => {
      const norm = fila.map(x => String(x).trim().toLowerCase());
      norm.forEach((v, cc) => {
        if (v !== 'causa novedad') return;
        // columna "Punto" de esa misma tabla: la más cercana a la izquierda
        let pc = -1;
        for (let k = cc - 1; k >= 0; k--){ if (norm[k] === 'causa novedad') break; if (norm[k] === 'punto'){ pc = k; break; } }
        if (pc < 0) return;
        for (let r = ri + 1; r < aoa.length; r++){
          const p = String(aoa[r][pc] || '').trim(), c = String(aoa[r][cc] || '').trim();
          if (!p || !c || c === '0') continue;
          (deResumen[p] = deResumen[p] || new Set()).add(c);
        }
      });
    });
    Object.entries(deResumen).forEach(([p, set]) => { causas[p] = causas[p] || new Set(); set.forEach(c => causas[p].add(c)); });
  }
  if (causas) Object.keys(causas).forEach(p => { causas[p] = [...causas[p]].join(' / '); });
  guardarReporte(rows, nombreArchivo, causas);
}

$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = '';
  const rd = new FileReader();
  const esExcel = /\.xlsx?$/i.test(f.name);
  rd.onload = () => esExcel ? leerExcel(new Uint8Array(rd.result), f.name) : guardarReporte(parseCSV(String(rd.result)), f.name, null);
  rd.onerror = () => toast('No se pudo leer el archivo');
  esExcel ? rd.readAsArrayBuffer(f) : rd.readAsText(f, 'utf-8');
});

render();
